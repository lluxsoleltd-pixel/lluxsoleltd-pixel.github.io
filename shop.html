<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ໂປຣໄຟລ໌ຮ້ານ · LLUX</title>
<style>
  :root { --red:#c8102e; --red2:#e0463b; --ink:#111827; --mute:#6b7280; --bg:#f5f5f7; --line:#e5e7eb; --green:#15803d; }
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: var(--bg); margin: 0; color: var(--ink); padding-bottom: 40px; }
  button, a { font-family: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .top { position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg, var(--red), var(--red2)); color: #fff; display: flex; align-items: center; gap: 10px; padding: 12px; }
  .top a { color: #fff; text-decoration: none; font-size: 26px; line-height: 1; padding: 0 6px; }
  .top b { font-size: 16px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cover { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #e5e7eb; display: block; }
  .head { background: #fff; padding: 14px 16px; }
  .head h1 { font-size: 20px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 600; color: var(--green); background: #dcfce7; border-radius: 6px; padding: 2px 8px; }
  .tag.warn { color: #92400e; background: #fef3c7; }
  .muted { color: var(--mute); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px; }
  .stat { background: #fff; border-radius: 12px; padding: 10px; text-align: center; font-size: 12px; color: var(--mute); }
  .stat b { display: block; font-size: 16px; color: var(--ink); }
  .box { background: #fff; margin: 12px; border-radius: 12px; padding: 14px; }
  .box h2 { font-size: 16px; margin: 0 0 10px; }
  .desc { margin: 0; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
  .contact { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .contact a { display: block; text-align: center; padding: 12px 6px; border-radius: 10px; text-decoration: none; color: #fff; background: var(--red); font-weight: 600; font-size: 14px; }
  .contact a.wa { background: #25d366; }
  .contact a.mail { background: #0369a1; }
  .contact a.map { background: #475569; }
  .contact a.off { background: #d1d5db; color: #6b7280; pointer-events: none; }
  .doc { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .doc:last-child { border-bottom: none; }
  .doc img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: #eee; flex: 0 0 auto; }
  .doc .pdf { width: 56px; height: 56px; border-radius: 8px; background: #fee2e2; color: var(--red); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex: 0 0 auto; }
  .doc .dt { flex: 1; font-size: 14px; }
  .doc a { color: var(--red); font-size: 13px; text-decoration: none; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .pcard { background: #f9fafb; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .pcard img, .pcard .ph { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #eee; display: block; }
  .pbody { padding: 8px; font-size: 13px; }
  .pname { font-weight: 600; margin: 0 0 4px; }
  .pprice { color: var(--red); font-weight: 700; }
  .pmeta { color: var(--mute); font-size: 11px; margin-top: 2px; min-height: 14px; }
  .padd { margin-top: 6px; width: 100%; border: none; background: var(--red); color: #fff; border-radius: 8px; padding: 8px; font-size: 14px; cursor: pointer; }
  .padd:disabled { background: #d1d5db; cursor: default; }
  .empty { color: var(--mute); font-size: 14px; margin: 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a href="products.html" title="ກັບໄປໜ້າສິນຄ້າ">‹</a>
    <b id="ttl">ໂປຣໄຟລ໌ຮ້ານ</b>
  </header>

  <img id="cover" class="cover hidden" alt="">

  <section class="head">
    <h1 id="name">ກຳລັງໂຫຼດ...</h1>
    <div id="tags"></div>
    <div class="muted" id="address"></div>
  </section>

  <section class="stats">
    <div class="stat"><b id="stEmp">-</b>ພະນັກງານ</div>
    <div class="stat"><b id="stStore">-</b>ໜ້າຮ້ານ</div>
    <div class="stat"><b id="stPrep">-</b>ເວລາຕຽມ (ນາທີ)</div>
  </section>

  <section class="box">
    <h2>ສິນຄ້າຂອງຮ້ານ</h2>
    <div class="grid" id="prods"></div>
    <p class="empty" id="prodMsg"></p>
  </section>

  <section class="box">
    <h2>ແນະນຳຮ້ານ</h2>
    <p class="desc" id="desc"></p>
  </section>

  <section class="box">
    <h2>ຕິດຕໍ່ຮ້ານ</h2>
    <div class="contact" id="contact"></div>
  </section>

  <section class="box">
    <h2>ເອກະສານ</h2>
    <div id="docs"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbySjDcvpFS8AD4NkOGlv06LQfTWQ9WBCxh72XM8d-TNI4yRsyaIkMz_lg78DN0ccqSaBQ/exec";
  const BIZ = { individual: "ບຸກຄົນ / ຮ້ານເລັກ", company: "ບໍລິສັດ", factory: "ໂຮງງານ / ຜູ້ຜະລິດ" };
  const DOC = { registration: "ໃບທະບຽນວິສາຫະກິດ", license: "ໃບອະນຸຍາດດຳເນີນທຸລະກິດ", other: "ເອກະສານອື່ນ" };
  const shopName = new URLSearchParams(location.search).get("shop") || "";
  let prodList = [];

  const $ = (id) => document.getElementById(id);
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function money(n) { return Number(n || 0).toLocaleString("en-US") + " ກີບ"; }

  // ===== ຕະກ້າ (ໃຊ້ຮ່ວມກັບໜ້າສິນຄ້າ) =====
  function getCart() { try { return JSON.parse(localStorage.getItem("llux_cart") || "[]"); } catch (e) { return []; } }
  function setCart(c) { try { localStorage.setItem("llux_cart", JSON.stringify(c)); } catch (e) {} }
  function toast(t) {
    $("toast").textContent = t;
    $("toast").classList.add("on");
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { $("toast").classList.remove("on"); }, 1400);
  }

  // ເບີ WhatsApp: 020... -> 85620...
  function waLink(phone) {
    let d = String(phone || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.charAt(0) === "0") d = "856" + d.slice(1);
    return "https://wa.me/" + d;
  }

  function contactHtml(p) {
    const tel = String(p.phone || "").replace(/[^\d+]/g, "");
    const wa = waLink(p.phone);
    const map = (p.lat != null && p.lng != null) ? "https://www.google.com/maps?q=" + p.lat + "," + p.lng : "";
    return (tel ? '<a href="tel:' + esc(tel) + '">📞 ໂທຫາ</a>' : '<a class="off">📞 ໂທຫາ</a>') +
      (wa ? '<a class="wa" target="_blank" rel="noopener" href="' + esc(wa) + '">💬 WhatsApp</a>' : '<a class="wa off">💬 WhatsApp</a>') +
      (p.email ? '<a class="mail" href="mailto:' + esc(p.email) + '">✉️ ອີເມວ</a>' : '<a class="mail off">✉️ ອີເມວ</a>') +
      (map ? '<a class="map" target="_blank" rel="noopener" href="' + esc(map) + '">📍 ແຜນທີ່</a>' : '<a class="map off">📍 ແຜນທີ່</a>');
  }

  function docsHtml(docs) {
    if (!docs || !docs.length) return '<p class="empty">ຍັງບໍ່ມີເອກະສານທີ່ອັບໂຫຼດ</p>';
    return docs.map(function (d) {
      const isPdf = String(d.url).indexOf("drive.google.com") >= 0;
      const thumb = isPdf ? '<div class="pdf">PDF</div>' : '<img src="' + esc(d.url) + '" alt="">';
      return '<div class="doc">' + thumb +
        '<div class="dt">' + esc(DOC[d.type] || d.type) + '</div>' +
        '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">ເປີດ ›</a></div>';
    }).join("");
  }

  let waitingDocs = false;

  function renderProducts() {
    if (!prodList.length) {
      $("prods").innerHTML = "";
      $("prodMsg").textContent = waitingDocs
        ? "ຮ້ານນີ້ກຳລັງລໍຖ້າກວດເອກະສານ ສິນຄ້າຈະສະແດງເມື່ອເອກະສານຄົບ"
        : "ຮ້ານນີ້ຍັງບໍ່ມີສິນຄ້າໃນລະບົບ";
      return;
    }
    $("prodMsg").textContent = "";
    $("prods").innerHTML = prodList.map(function (i, idx) {
      const out = i.status === "soldout";
      const meta = [i.weightKg ? "ນ້ຳໜັກ " + esc(i.weightKg) + " ກກ" : "", i.cbm ? "CBM " + esc(i.cbm) : ""].filter(Boolean).join(" · ");
      return '<div class="pcard">' +
        (i.imageUrl ? '<img loading="lazy" src="' + esc(i.imageUrl) + '" alt="">' : '<div class="ph"></div>') +
        '<div class="pbody"><p class="pname">' + esc(i.itemName) + '</p>' +
        '<div class="pprice">' + money(i.price) + '</div>' +
        '<div class="pmeta">' + meta + '</div>' +
        '<button class="padd" data-idx="' + idx + '"' + (out ? ' disabled' : '') + '>' + (out ? 'ໝົດແລ້ວ' : '+ ເພີ່ມເຂົ້າຕະກ້າ') + '</button></div></div>';
    }).join("");
  }

  $("prods").addEventListener("click", function (e) {
    const b = e.target.closest("[data-idx]");
    if (!b || b.disabled) return;
    const i = prodList[Number(b.dataset.idx)];
    if (!i) return;
    const c = getCart();
    const f = c.find(function (x) { return x.shopName === i.shopName && x.itemName === i.itemName; });
    if (f) f.qty = Math.min(99, f.qty + 1);
    else c.push({ shopName: i.shopName, itemName: i.itemName, price: i.price, imageUrl: i.imageUrl || "", weightKg: i.weightKg || 0, cbm: i.cbm || 0, qty: 1 });
    setCart(c);
    toast("ເພີ່ມເຂົ້າຕະກ້າແລ້ວ");
  });

  async function loadProfile() {
    const r = await fetch(API + "?type=shopprofile&shop=" + encodeURIComponent(shopName), { cache: "no-store" });
    const p = await r.json();
    if (!p || !p.ok) {
      $("name").textContent = "ບໍ່ພົບຮ້ານນີ້";
      $("prodMsg").textContent = "";
      return;
    }
    waitingDocs = !!p.needsDocs && !p.complete;
    document.title = p.name + " · LLUX";
    $("ttl").textContent = p.name;
    $("name").textContent = p.name;
    let tags = '<span class="tag">✔ ຮ້ານຢືນຢັນ</span>';
    tags += ' <span class="muted">' + esc(BIZ[p.bizType] || "") + '</span>';
    if (p.needsDocs) {
      tags += p.complete ? ' <span class="tag">✔ ເອກະສານຄົບ</span>' : ' <span class="tag warn">ຍັງບໍ່ຄົບເອກະສານ</span>';
    }
    $("tags").innerHTML = tags;
    $("address").textContent = p.address || "";
    if (p.imageUrl) { $("cover").src = p.imageUrl; $("cover").classList.remove("hidden"); }
    $("stEmp").textContent = p.employees || "-";
    $("stStore").textContent = p.hasStore ? "ມີ" : "ບໍ່ມີ";
    $("stPrep").textContent = p.prepMinutes || "-";
    $("desc").textContent = p.description || "ຍັງບໍ່ມີຄຳແນະນຳ";
    $("contact").innerHTML = contactHtml(p);
    $("docs").innerHTML = docsHtml(p.docs);
  }

  async function loadProducts() {
    try {
      const r = await fetch(API + "?type=products", { cache: "no-store" });
      const all = await r.json();
      prodList = (Array.isArray(all) ? all : []).filter(function (i) { return i.shopName === shopName; });
    } catch (e) {
      prodList = [];
      $("prodMsg").textContent = "ໂຫຼດສິນຄ້າບໍ່ໄດ້ ລອງໃໝ່ອີກຄັ້ງ";
      return;
    }
    renderProducts();
  }

  if (!shopName) {
    $("name").textContent = "ບໍ່ພົບຮ້ານນີ້";
    $("prodMsg").textContent = "";
  } else {
    loadProfile()
      .catch(function () { $("name").textContent = "ໂຫຼດຂໍ້ມູນຮ້ານບໍ່ໄດ້"; })
      .then(loadProducts);
  }
</script>
</body>
</html>
