<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LLUX ຮ້ານ">
<title>LLUX ຮ້ານຄ້າ</title>
<style>
  /* ສີຫຼັກຂອງໜ້າ */
  :root { --bg:#f5f6f8; --card:#ffffff; --text:#1d2330; --muted:#6b7280; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --btn:#2563eb; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1218; --card:#1a1f2a; --text:#e8ebf1; --muted:#9aa3b2; --line:#2a3140; }
  }
  :root[data-theme="dark"] { --bg:#0f1218; --card:#1a1f2a; --text:#e8ebf1; --muted:#9aa3b2; --line:#2a3140; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Noto Sans Lao",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  h2 { font-size:16px; margin:0 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card.alert { border-color:var(--warn); box-shadow:0 0 0 2px rgba(217,119,6,.25); }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:15px; }
  .tag { display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; background:var(--line); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  input, select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; margin-top:6px; }
  button { width:100%; padding:13px; border:0; border-radius:12px; font-size:16px; background:var(--btn); color:#fff; cursor:pointer; margin-top:8px; }
  button.secondary { background:#6b7280; }
  button.danger { background:var(--bad); }
  button.good { background:var(--ok); }
  button:disabled { opacity:.5; cursor:default; }
  .btns { display:flex; gap:8px; }
  .btns button { margin-top:8px; }
  button[data-act="accept"] { transition: transform .15s ease, box-shadow .15s ease; }
  body.pulse .alert button[data-act="accept"] { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(22,163,74,.45); }
  .slip { display:inline-block; margin-top:6px; font-size:15px; }
  .hidden { display:none !important; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .small { font-size:13px; }
  .tabs2 { display:flex; gap:8px; margin:4px 0 12px; }
  .tabs2 button { margin-top:0; width:auto; flex:1; }
  .mitem { display:flex; gap:12px; align-items:center; }
  .mitem img { width:64px; height:64px; object-fit:cover; border-radius:10px; background:var(--line); flex:0 0 64px; }
  .mitem .mtxt { flex:1; min-width:0; }
  .mitem .mtxt b { display:block; font-size:16px; }
  .mitem .mbtns { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .mitem .mbtns button { width:auto; margin:0; padding:6px 10px; font-size:14px; }
</style>
<script src="categories.js"></script>
</head>
<body>
<div class="wrap">

  <!-- ໜ້າເຂົ້າສູ່ລະບົບຮ້ານ -->
  <div id="loginView" class="card">
    <h1>ເຂົ້າສູ່ລະບົບຮ້ານ</h1>
    <label class="muted">ເລືອກຮ້ານ</label>
    <select id="shopSelect"><option value="">ກຳລັງໂຫຼດ...</option></select>
    <label class="muted">ລະຫັດ PIN ຂອງຮ້ານ</label>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="ປ້ອນ PIN">
    <button id="btnLogin">ເຂົ້າສູ່ລະບົບ</button>
    <p id="loginMsg" class="muted small"></p>
  </div>

  <!-- ໜ້າຫຼັກຂອງຮ້ານ -->
  <div id="shopView" class="hidden">
    <div class="card">
      <div class="topbar">
        <div>
          <div class="muted small">ຮ້ານ</div>
          <h2 id="shopTitle">-</h2>
        </div>
        <button id="btnLogout" class="secondary" style="width:auto;padding:8px 12px;margin:0;">ອອກ</button>
      </div>
      <div class="btns">
        <button id="btnNotify" class="secondary">ເປີດການແຈ້ງເຕືອນ</button>
        <button id="btnMute" class="secondary">ປິດສຽງ</button>
      </div>
      <p id="notifyState" class="muted small"></p>
    </div>

    <p id="emptyMsg" class="muted hidden">ຍັງບໍ່ມີອໍເດີໃໝ່</p>
    <div class="tabs2">
      <button id="tabOrders" class="good">ອໍເດີ</button>
      <button id="tabMenu" class="secondary">ເມນູສິນຄ້າ</button>
      <button id="tabSettings" class="secondary">ຕັ້ງຄ່າຮ້ານ</button>
    </div>

    <!-- ໜ້າເມນູສິນຄ້າຂອງຮ້ານ -->
    <div id="menuView" class="hidden">
      <div class="card">
        <h2 id="menuFormTitle">ເພີ່ມສິນຄ້າໃໝ່</h2>
        <label class="muted small">ຊື່ສິນຄ້າ</label>
        <input id="mName" type="text">
        <label class="muted small">ລາຄາ (ກີບ)</label>
        <input id="mPrice" type="number" min="1" step="100" inputmode="numeric">
        <label class="muted small">ໝວດສິນຄ້າ</label>
        <select id="mCat"></select>
        <label class="muted small">ລາຍລະອຽດ</label>
        <input id="mDesc" type="text">
        <label class="muted small">ນ້ຳໜັກຫຼັງແພັກ (ກກ)</label>
        <input id="mWeight" type="text" autocomplete="off" inputmode="text" placeholder="ເຊັ່ນ 2.5 ຫຼື 0.5*2+1">
        <label class="muted small">ຂະໜາດຫຼັງແພັກ (CBM)</label>
        <input id="mCbm" type="text" autocomplete="off" inputmode="text" placeholder="ເຊັ່ນ 0.6*0.2*1">
        <p class="muted small">ພິມສູດໄດ້ເລີຍ ເຊັ່ນ 0.5*0.4*0.3 (ກວ້າງ*ຍາວ*ສູງ ເປັນແມັດ) ແລ້ວກົດ Enter ຫຼື ກົດຊ່ອງອື່ນ ລະບົບຈະຄຳນວນໃຫ້ອັດຕະໂນມັດ</p>
        <label class="muted small">ຂອບເຂດການຂາຍ (ເລືອກໄດ້ຫຼາຍຂໍ້)</label>
        <div class="scopes">
          <label><input type="checkbox" class="scope" value="local"> ສົ່ງໃກ້ຄຽງ</label>
          <label><input type="checkbox" class="scope" value="nationwide"> ສົ່ງທົ່ວປະເທດ</label>
          <label><input type="checkbox" class="scope" value="global"> ສົ່ງອອກທົ່ວໂລກ</label>
        </div>
        <label><input type="checkbox" id="mShipBranch"> ຮ້ານສົ່ງໄປຍັງສາຂາເອງ (ຄ່າສົ່ງລວມໃນລາຄາ)</label>
        <label class="muted small">ຮູບສິນຄ້າ</label>
        <input id="mImg" type="file" accept="image/*">
        <img id="mPreview" class="hidden" alt="" style="width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-top:8px;">
        <button id="mSave">ບັນທຶກສິນຄ້າ</button>
        <button id="mCancel" class="secondary hidden">ຍົກເລີກການແກ້ໄຂ</button>
        <p id="mMsg" class="muted small"></p>
      </div>
      <div id="menuList"></div>
    </div>

    <!-- ໜ້າຕັ້ງຄ່າຮ້ານ -->
    <div id="settingsView" class="hidden">
      <div class="card">
        <label class="muted small">ຊື່ຮ້ານ (ປັດຈຸບັນ)</label>
        <p id="sName" style="font-weight:bold;margin:4px 0 0;">-</p>
        <p id="sNameNote" class="muted small"></p>
        <label class="muted small">ປ່ຽນຊື່ຮ້ານ (ຕ້ອງໃຫ້ແອດມິນ LLUX ອະນຸມັດ)</label>
        <input id="sNewName" type="text" placeholder="ຊື່ໃໝ່">
        <button id="sNameBtn" class="secondary">ສົ່ງຄຳຂໍປ່ຽນຊື່</button>
        <p id="sNameMsg" class="muted small"></p>
      </div>

      <div class="card">
        <label class="muted small">ຮູບໜ້າຮ້ານ</label>
        <input id="sPhoto" type="file" accept="image/*">
        <img id="sPhotoPrev" class="hidden" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:8px;">
        <label class="muted small">ເບີໂທ</label>
        <input id="sPhone" type="tel" inputmode="tel">
        <label class="muted small">ອີເມວຮ້ານ</label>
        <input id="sEmail" type="email" inputmode="email">
        <label class="muted small">ທີ່ຢູ່ຮ້ານ</label>
        <input id="sAddr" type="text">
        <label class="muted small">ຕຳແໜ່ງຮ້ານ</label>
        <p id="sGeo" class="small" style="margin:4px 0;"></p>
        <button id="sGeoBtn" class="secondary">ໃຊ້ຕຳແໜ່ງປັດຈຸບັນ</button>
        <button id="sSave">ບັນທຶກຂໍ້ມູນຮ້ານ</button>
        <p id="sMsg" class="muted small"></p>
      </div>

      <div class="card">
        <label class="muted small">ປະເພດຮ້ານ</label>
        <select id="sBiz">
          <option value="individual">ບຸກຄົນ / ຮ້ານເລັກ</option>
          <option value="company">ບໍລິສັດ</option>
          <option value="factory">ໂຮງງານ / ຜູ້ຜະລິດ</option>
        </select>
        <label class="muted small">ມີໜ້າຮ້ານ / ສຳນັກງານຈິງ</label>
        <select id="sHasStore">
          <option value="no">ບໍ່ມີ</option>
          <option value="yes">ມີ</option>
        </select>
        <label class="muted small">ຈຳນວນພະນັກງານ (ຄົນ)</label>
        <input id="sEmp" type="number" inputmode="numeric" min="0">
        <label class="muted small">ແນະນຳຮ້ານ / ບໍລິສັດ (ສູງສຸດ 1000 ຕົວອັກສອນ)</label>
        <textarea id="sDesc" rows="4" maxlength="1000"></textarea>
        <button id="sProfileSave">ບັນທຶກໂປຣໄຟລ໌</button>
        <p id="sProfileMsg" class="muted small"></p>
      </div>

      <div class="card">
        <label class="muted small">ເອກະສານ (ບັງຄັບສຳລັບບໍລິສັດ / ໂຮງງານ / ຮ້ານທີ່ມີໜ້າຮ້ານ · ຮູບ ຫຼື PDF ບໍ່ເກີນ 5MB)</label>
        <p id="sDocNote" class="small" style="margin:4px 0;"></p>
        <label class="muted small">ໃບທະບຽນວິສາຫະກິດ</label>
        <input id="sDocRegistration" type="file" accept="image/*,application/pdf">
        <label class="muted small">ໃບອະນຸຍາດດຳເນີນທຸລະກິດ</label>
        <input id="sDocLicense" type="file" accept="image/*,application/pdf">
        <label class="muted small">ເອກະສານອື່ນ (ເພີ່ມໄດ້ຫຼາຍໄຟລ໌)</label>
        <input id="sDocOther" type="file" accept="image/*,application/pdf" multiple>
        <div id="sDocList"></div>
        <p id="sDocMsg" class="muted small"></p>
      </div>

      <div class="card">
        <a id="sAdmin" class="hidden" target="_blank" rel="noopener" href="#" style="display:block;text-align:center;background:#0369a1;color:#fff;padding:12px;border-radius:10px;text-decoration:none;">ຕິດຕໍ່ແອດມິນ LLUX ດ່ວນ</a>
      </div>
    </div>

    <div id="orders"></div>
    <p id="netMsg" class="muted small"></p>
  </div>
</div>

<!-- SDK ແຈ້ງເຕືອນ OneSignal -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  // ການຕັ້ງຄ່າ
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySjDcvpFS8AD4NkOGlv06LQfTWQ9WBCxh72XM8d-TNI4yRsyaIkMz_lg78DN0ccqSaBQ/exec";
  const APP_ID = "ab31f26a-4291-45f3-838c-1ae71dfa2fb0";
  const POLL_MS = 8000;          // ດຶງອໍເດີໃໝ່ທຸກ 8 ວິນາທີ
  const RIDER_LIMIT_MS = 5 * 60 * 1000; // ຮ້ານຕ້ອງແພັກໃຫ້ໄຣເດີພາຍໃນ 5 ນາທີ

  const $ = (id) => document.getElementById(id);

  // ສະຖານະ ທີ່ແປເປັນພາສາລາວ
  const STATUS_TXT = {
    shop_pending: "ລໍຖ້າຮ້ານຮັບອໍເດີ",
    awaiting_payment: "ລໍຖ້າລູກຄ້າຊຳລະເງິນ",
    open_for_rider: "ຮ້ານຢືນຢັນການຊຳລະແລ້ວ ກຳລັງຫາໄຣເດີ",
    accepted: "ໄຣເດີຮັບງານແລ້ວ ກະລຸນາແພັກສິນຄ້າ",
    ready: "ແພັກແລ້ວ ລໍຖ້າໄຣເດີມາຮັບ",
    picked_up: "ໄຣເດີຮັບສິນຄ້າແລ້ວ",
    delivered: "ສົ່ງສຳເລັດ",
    shop_rejected: "ຮ້ານປະຕິເສດແລ້ວ",
    shipped_to_branch: "ຮ້ານສົ່ງເຂົ້າສາຂາແລ້ວ · ລູກຄ້າໄປຮັບທີ່ສາຂາ"
  };
  const ERR_TXT = {
    auth: "PIN ບໍ່ຖືກຕ້ອງ",
    route: "ກະລຸນາເລືອກວິທີສົ່ງກ່ອນຊຳລະ",
    state: "ສະຖານະປ່ຽນແລ້ວ ກະລຸນາລອງໃໝ່",
    notyours: "ອໍເດີນີ້ບໍ່ແມ່ນຂອງຮ້ານນີ້",
    row: "ບໍ່ພົບອໍເດີ"
  };

  // ສະຖານະໃນຫນ່ວຍຄວາມຈຳ
  let session = null;      // { shopName, pin }
  let orders = [];
  let muted = false;
  let audioCtx = null;
  let beepTimer = null;
  let pollTimer = null;
  const seenNew = new Set(); // ອໍເດີໃໝ່ທີ່ເຄີຍແຈ້ງແລ້ວ

  // ເຣັດ HTML ປ້ອງກັນ ຂໍ້ຄວາມທີ່ມາຈາກລູກຄ້າ
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) { return Number(n || 0).toLocaleString("en-US") + " ກີບ"; }

  // ເອີ້ນ API ດ້ວຍ GET
  async function apiGet(params) {
    const url = SCRIPT_URL + "?" + new URLSearchParams(params).toString();
    const res = await fetch(url);
    return res.json();
  }
  // ເອີ້ນ API ດ້ວຍ POST (text/plain ເພື່ອຫຼີກເລີ່ງ preflight)
  async function apiPost(obj) {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(obj)
    });
    return res.json();
  }

  // ສຽງເຕືອນ (ສ້າງດ້ວຍ Web Audio ບໍ່ຕ້ອງມີໄຟລ໌)
  function ensureAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { /* ບາງເບຣາວເຊີ */ }
  }
  function beepOnce() {
    // ປຸ່ມຮັບອໍເດີກະພິບພ້ອມກັບສຽງເຕືອນ
    document.body.classList.add("pulse");
    setTimeout(function () { document.body.classList.remove("pulse"); }, 300);
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.3;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }
  function startAlarm() {
    if (muted || beepTimer) return;
    ensureAudio();
    beepOnce();
    beepTimer = setInterval(beepOnce, 900);
  }
  function stopAlarm() {
    clearInterval(beepTimer);
    beepTimer = null;
    document.body.classList.remove("pulse");
  }

  // ອໍເດີທີ່ຮ້ານຕ້ອງດຳເນີນການ
  function needsAction(o) {
    if (o.status === "shop_pending") return true;
    if (o.status === "awaiting_payment" && (o.paymentStatus === "slip_uploaded" || o.paymentStatus === "claimed")) return true;
    if (o.status === "accepted") return true;
    return false;
  }

  // ແຈ້ງເຕືອນເມື່ອມີອໍເດີໃໝ່ (ໃຊ້ໄດ້ເມື່ອໜ້ານີ້ເປີດຢູ່)
  function notifyNew(o) {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("ອໍເດີໃໝ່ " + o.orderId, { body: STATUS_TXT[o.status] || "" });
    }
  }

  // ດຶງອໍເດີຂອງຮ້ານ
  async function refresh() {
    if (!session) return;
    try {
      const data = await apiGet({ type: "shoporders", shopName: session.shopName, pin: session.pin });
      if (data && data.error === "auth") { logout(); $("loginMsg").textContent = ERR_TXT.auth; return; }
      orders = Array.isArray(data) ? data : [];
      $("netMsg").textContent = "";
      // ກວດອໍເດີໃໝ່
      let alarmNeeded = false;
      orders.forEach(function (o) {
        const key = o.row + ":" + o.status + ":" + o.paymentStatus;
        if (needsAction(o)) alarmNeeded = true;
        if (!seenNew.has(key) && needsAction(o)) {
          seenNew.add(key);
          notifyNew(o);
        }
      });
      if (alarmNeeded) startAlarm(); else stopAlarm();
      render();
    } catch (e) {
      $("netMsg").textContent = "ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກຳລັງລອງໃໝ່...";
    }
  }

  // ສົ່ງຄຳສັ່ງຂອງຮ້ານ (accept/reject/confirm_payment/ready)
  async function act(row, action) {
    try {
      const res = await apiPost({ type: "shop", shopName: session.shopName, pin: session.pin, row: row, action: action });
      if (!res.ok) alert(ERR_TXT[res.reason] || ("ເກີດຂໍ້ຜິດພາດ (" + (res.reason || "ບໍ່ຮູ້ສາເຫດ") + ")"));
    } catch (e) {
      alert("ສົ່ງຄຳສັ່ງບໍ່ໄດ້ ກະລຸນາລອງໃໝ່");
    }
    stopAlarm();
    refresh();
  }

  async function routeAct(row, via) {
    try {
      const res = await apiPost({ type: "shop", shopName: session.shopName, pin: session.pin, row: row, action: "route", via: via });
      if (!res.ok) alert(ERR_TXT[res.reason] || ("ເກີດຂໍ້ຜິດພາດ (" + (res.reason || "ບໍ່ຮູ້ສາເຫດ") + ")"));
    } catch (e) {
      alert("ສົ່ງຄຳສັ່ງບໍ່ໄດ້ ກະລຸນາລອງໃໝ່");
    }
    refresh();
  }

  // ສະແດງຜົນ
  function render() {
    const box = $("orders");
    $("emptyMsg").classList.toggle("hidden", activeTab !== "orders" || orders.length > 0);
    box.innerHTML = orders.map(orderCard).join("");
  }

  function orderCard(o) {
    const alert = needsAction(o) ? " alert" : "";
    let body = "";
    body += '<div class="row"><span>ເລກອໍເດີ</span><span>' + esc(o.orderId) + '</span></div>';
    body += '<div class="row"><span>ລູກຄ້າ</span><span>' + esc(o.customerName) + ' · <a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a></span></div>';
    body += '<div class="row"><span>ລາຍການ</span><span>' + esc(o.itemDesc) + '</span></div>';
    body += '<div class="row"><span>ມູນຄ່າສິນຄ້າ</span><span>' + money(o.goodsTotal) + '</span></div>';
    if (o.serviceType === "buy" && Number(o.fee) > 0) {
      if (o.deliveryType !== "ship") body += '<div class="row"><span>ຄ່າສົ່ງ (ຈ່າຍໃຫ້ໄຣເດີ)</span><span>' + money(o.fee) + '</span></div>';
      body += '<div class="row"><span>ລູກຄ້າໂອນລວມ</span><span>' + money(Number(o.goodsTotal) + Number(o.fee)) + '</span></div>';
    }

    // ການຊຳລະ
    if (o.status === "awaiting_payment") {
      const paid = o.paymentStatus === "slip_uploaded"
        ? '<span class="ok">ລູກຄ້າອັບໂຫຼດສລິບແລ້ວ</span>'
        : o.paymentStatus === "claimed"
          ? '<span class="ok">ລູກຄ້າແຈ້ງວ່າໂອນແລ້ວ</span>'
          : '<span class="warn">ລູກຄ້າຍັງບໍ່ໄດ້ແຈ້ງການໂອນ</span>';
      body += '<div class="row"><span>ການຊຳລະ</span>' + paid + '</div>';
      if (o.slipUrl) body += '<a class="slip" href="' + esc(o.slipUrl) + '" target="_blank" rel="noopener">ເບິ່ງສລິບ</a>';
    }

    // ໄຣເດີ + ນັບເວລາ 5 ນາທີ
    if (o.riderName) body += '<div class="row"><span>ໄຣເດີ</span><span>' + esc(o.riderName) + '</span></div>';
    if (o.status === "accepted" && o.riderAcceptedAt) {
      const deadline = new Date(o.riderAcceptedAt).getTime() + RIDER_LIMIT_MS;
      body += '<div class="row"><span>ເວລາທີ່ເຫຼືອ</span><span class="countdown" data-deadline="' + deadline + '">-</span></div>';
    }

    // ສະຖານະ
    body += '<p class="muted small" style="margin:8px 0 0;">' + esc(STATUS_TXT[o.status] || o.status) + '</p>';

    // ປຸ່ມຕາມສະຖານະ
    let btns = "";
    const shipPending = o.deliveryType === "ship" && o.serviceType === "buy" && o.shipVia === "pending";
    if (o.deliveryType === "ship" && o.serviceType === "buy" && o.shipVia && o.shipVia !== "pending") {
      body += '<div class="row"><span>ວິທີສົ່ງ</span><span>' + (o.shipVia === "shop" ? "ຮ້ານສົ່ງເອງໄປສາຂາ" : "ໄຣເດີ LLUX ໄປຮັບ") + '</span></div>';
    }
    if (o.deliveryType === "ship" && o.carrier) {
      body += '<div class="row"><span>ບໍລິສັດຂົນສົ່ງ</span><span>' + esc(o.carrier) + '</span></div>';
      body += '<div class="row"><span>ສາຂາປາຍທາງ</span><span>' + esc(o.branch || "-") + '</span></div>';
    }
    if (o.status === "shop_pending") {
      btns = '<div class="btns"><button class="good" data-act="accept" data-row="' + o.row + '">ຮັບອໍເດີ</button>' +
             '<button class="danger" data-act="reject" data-row="' + o.row + '">ປະຕິເສດ</button></div>';
    } else if (o.status === "awaiting_payment" && shipPending) {
      btns = '<p class="muted small">ເລືອກວິທີສົ່ງໄປຕ່າງແຂວງກ່ອນ</p>' +
             '<div class="btns"><button class="good" data-act="route_shop" data-row="' + o.row + '">ຮ້ານສົ່ງເອງໄປສາຂານີ້</button>' +
             '<button class="secondary" data-act="route_llux" data-row="' + o.row + '">ໃຫ້ໄຣເດີ LLUX ມາຮັບ</button></div>' +
             '<div class="btns"><button class="danger" data-act="reject" data-row="' + o.row + '">ຍົກເລີກອໍເດີ</button></div>';
    } else if (o.status === "awaiting_payment") {
      btns = '<div class="btns"><button class="good" data-act="confirm_payment" data-row="' + o.row + '">ໄດ້ຮັບຍອດໂອນແລ້ວ · ໃຫ້ຈັດຂອງເລີຍ</button>' +
             '<button class="danger" data-act="reject" data-row="' + o.row + '">ຍົກເລີກອໍເດີ</button></div>';
    } else if (o.status === "accepted" || o.status === "open_for_rider") {
      btns = '<button class="good" data-act="ready" data-row="' + o.row + '">ກຳລັງແພັກ · ແພັກແລ້ວ ລໍໄຣເດີມາຮັບ</button>';
    } else if (o.status === "ready") {
      // ຮ້ານຈ່າຍຄ່າສົ່ງ ແລະ ມອບຂອງໃຫ້ໄຣເດີ (ກົດຄັ້ງດຽວ) — ຈົນກວ່າກົດແລ້ວປຸ່ມຍັງຢູ່ ບໍ່ຫາຍ
      if (o.serviceType === "buy" && o.feePaymentStatus === "confirmed") {
        btns = '<p class="muted small">ຈ່າຍຄ່າສົ່ງ ແລະ ມອບຂອງໃຫ້ໄຣເດີແລ້ວ ✔ ລໍຖ້າໄຣເດີຢືນຢັນຮັບຂອງ</p>';
      } else {
        btns = '<button class="good" data-act="handover" data-row="' + o.row + '">' + (o.deliveryType === "ship" ? 'ມອບຂອງໃຫ້ໄຣເດີແລ້ວ' : 'ຈ່າຍຄ່າສົ່ງ ແລະ ມອບຂອງໃຫ້ໄຣເດີແລ້ວ') + '</button>';
      }
    }

    return '<div class="card' + alert + '">' + body + btns + '</div>';
  }

  // ນັບຖອຍຫຼັງ 5 ນາທີ ທຸກ 1 ວິນາທີ
  function tickCountdown() {
    const now = Date.now();
    document.querySelectorAll(".countdown").forEach(function (el) {
      const left = Number(el.dataset.deadline) - now;
      if (left <= 0) {
        el.textContent = "ເກີນເວລາແລ້ວ";
        el.className = "bad";
      } else {
        const m = Math.floor(left / 60000);
        const s = Math.floor((left % 60000) / 1000);
        el.textContent = m + ":" + String(s).padStart(2, "0");
        el.className = left < 60000 ? "warn" : "";
      }
    });
  }

  // ເຂົ້າສູ່ລະບົບ
  async function login() {
    ensureAudio(); // ປົດລັອກສຽງດ້ວຍການກົດ
    const shopName = $("shopSelect").value;
    const pin = $("pinInput").value.trim();
    if (!shopName || !pin) { $("loginMsg").textContent = "ເລືອກຮ້ານ ແລະ ປ້ອນ PIN"; return; }
    $("loginMsg").textContent = "ກຳລັງກວດ...";
    try {
      const data = await apiGet({ type: "shoporders", shopName: shopName, pin: pin });
      if (data && data.error === "auth") { $("loginMsg").textContent = ERR_TXT.auth; return; }
      session = { shopName: shopName, pin: pin };
      try { localStorage.setItem("llux_shop", JSON.stringify(session)); } catch (e) {}
      afterLogin();
    } catch (e) {
      $("loginMsg").textContent = "ເຊື່ອມຕໍ່ບໍ່ໄດ້";
    }
  }

  function afterLogin() {
    $("loginView").classList.add("hidden");
    $("shopView").classList.remove("hidden");
    $("shopTitle").textContent = session.shopName;
    refresh();
    clearInterval(pollTimer);
    pollTimer = setInterval(refresh, POLL_MS);
    // ຕັ້ງ tag ໃຫ້ OneSignal ເພື່ອໃຊ້ສົ່ງແຈ້ງເຕືອນໄປຫາຮ້ານນີ້ໃນອະນາຄົດ
    if (window.OneSignalReady) window.OneSignalReady(session.shopName);
  }

  function logout() {
    session = null;
    orders = [];
    stopAlarm();
    clearInterval(pollTimer);
    try { localStorage.removeItem("llux_shop"); } catch (e) {}
    $("shopView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    $("pinInput").value = "";
  }

  // ໂຫຼດລາຍຊື່ຮ້ານ
  async function loadShops() {
    try {
      const shops = await apiGet({});
      const sel = $("shopSelect");
      sel.innerHTML = '<option value="">ເລືອກຮ້ານ</option>' +
        shops.map(function (s) { return '<option value="' + esc(s.shopName) + '">' + esc(s.shopName) + '</option>'; }).join("");
    } catch (e) {
      $("shopSelect").innerHTML = '<option value="">ໂຫຼດລາຍຊື່ຮ້ານບໍ່ໄດ້</option>';
    }
  }

  // ປຸ່ມຕ່າງໆ
  $("btnLogin").onclick = login;
  $("btnLogout").onclick = logout;
  $("btnMute").onclick = function () {
    muted = !muted;
    $("btnMute").textContent = muted ? "ເປີດສຽງ" : "ປິດສຽງ";
    if (muted) stopAlarm(); else refresh();
  };
  $("orders").addEventListener("click", function (ev) {
    const b = ev.target.closest("button[data-act]");
    if (!b) return;
    if (b.dataset.act === "reject" && !confirm("ຍົກເລີກອໍເດີນີ້ແທ້ບໍ?")) return;
    if (b.dataset.act === "route_shop" || b.dataset.act === "route_llux") {
      if (!confirm("ຢືນຢັນເລືອກວິທີສົ່ງນີ້?")) return;
      routeAct(Number(b.dataset.row), b.dataset.act === "route_shop" ? "shop" : "llux");
      return;
    }
    act(Number(b.dataset.row), b.dataset.act);
  });

  // ປຸ່ມເປີດການແຈ້ງເຕືອນ (OneSignal)
  $("btnNotify").onclick = async function () {
    ensureAudio();
    try {
      await window.OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.Notifications.requestPermission();
      });
    } catch (e) { /* ປະຕິເສດ */ }
    if ("Notification" in window && Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch (e) {}
    }
    updateNotifyState();
  };
  function updateNotifyState() {
    const ok = "Notification" in window && Notification.permission === "granted";
    $("notifyState").textContent = ok ? "ການແຈ້ງເຕືອນເປີດແລ້ວ" : "ຍັງບໍ່ໄດ້ເປີດການແຈ້ງເຕືອນ";
    $("notifyState").className = ok ? "ok small" : "warn small";
  }

  // ຕັ້ງຄ່າ OneSignal ແລະ tag ຮ້ານ
  window.OneSignalReady = null;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    try {
      await OneSignal.init({ appId: APP_ID, allowLocalhostAsSecureOrigin: true });
      window.OneSignalReady = function (shopName) {
        OneSignal.User.addTag("shop", shopName);
      };
      if (session) window.OneSignalReady(session.shopName);
    } catch (e) {
      $("notifyState").textContent = "ລະບົບແຈ້ງເຕືອນໃຊ້ບໍ່ໄດ້";
    }
  });

  // ເລີ່ມຕົ້ນ
  // ===== ເມນູສິນຄ້າຂອງຮ້ານ =====
  const MENU_CATS = LLUX_CATEGORIES.map(function (c) { return c.name; });
  let activeTab = "orders";
  let menuItems = [];
  let editingRow = null;

  function fillCats() {
    $("mCat").innerHTML = MENU_CATS.map(function (c) {
      return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
    }).join("");
  }

  function showTab(which) {
    activeTab = which;
    $("tabOrders").className = which === "orders" ? "good" : "secondary";
    $("tabMenu").className = which === "menu" ? "good" : "secondary";
    $("tabSettings").className = which === "settings" ? "good" : "secondary";
    $("menuView").classList.toggle("hidden", which !== "menu");
    $("settingsView").classList.toggle("hidden", which !== "settings");
    $("orders").classList.toggle("hidden", which !== "orders");
    if (which === "menu") { $("emptyMsg").classList.add("hidden"); loadMenu(); }
    else if (which === "settings") { $("emptyMsg").classList.add("hidden"); loadSettings(); }
    else render();
  }

  async function loadMenu() {
    if (!session) return;
    try {
      const data = await apiGet({ type: "mymenu", shopName: session.shopName, pin: session.pin });
      if (data && data.error === "auth") { logout(); return; }
      menuItems = Array.isArray(data) ? data : [];
      renderMenu();
    } catch (e) {
      $("mMsg").textContent = "ໂຫຼດເມນູບໍ່ໄດ້";
    }
  }

  function renderMenu() {
    $("menuList").innerHTML = menuItems.map(function (it) {
      const soldout = it.status === "soldout";
      const img = it.imageUrl ? '<img src="' + esc(it.imageUrl) + '" alt="">' : '';
      return '<div class="card mitem">' + img +
        '<div class="mtxt"><b>' + esc(it.itemName) + '</b>' +
        '<span class="muted small">' + esc(it.category) + ' · ' + money(it.price) + '</span>' +
        '<span class="muted small">ນ້ຳໜັກ ' + (it.weightKg ? it.weightKg + ' ກກ' : 'ຍັງບໍ່ລະບຸ') + ' · ' + (it.cbm ? it.cbm + ' CBM' : 'ຍັງບໍ່ລະບຸ') + '</span>' +
        '<span class="muted small">' + (scopeList(it).map(function (s) { return SCOPE_TXT[s] || s; }).join(' · ') || 'ຍັງບໍ່ລະບຸຂອບເຂດການຂາຍ') + (it.shipBranch === "yes" ? ' · ຮ້ານສົ່ງໄປສາຂາເອງ' : '') + '</span>' +
        (soldout ? ' <span class="bad small">ໝົດແລ້ວ</span>' : '') +
        '<div class="mbtns">' +
          '<button class="secondary" data-m="edit" data-row="' + it.row + '">ແກ້ໄຂ</button>' +
          '<button class="' + (soldout ? 'good' : 'secondary') + '" data-m="soldout" data-row="' + it.row + '" data-soldout="' + (soldout ? '0' : '1') + '">' +
            (soldout ? 'ມີສິນຄ້າແລ້ວ' : 'ໝົດແລ້ວ') + '</button>' +
          '<button class="danger" data-m="delete" data-row="' + it.row + '">ລົບ</button>' +
        '</div></div></div>';
    }).join("") || '<p class="muted small">ຍັງບໍ່ມີສິນຄ້າ</p>';
  }

  // ຫຍໍ້ຮູບໃນເບຣາວເຊີ (ສູງສຸດ 800px) ເພື່ອໃຫ້ສົ່ງໄວ ແລະ ໄຟລ໌ເລັກ
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          const scale = Math.min(1, 800 / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  const SCOPE_TXT = { local: "ສົ່ງໃກ້ຄຽງ", nationwide: "ສົ່ງທົ່ວປະເທດ", global: "ສົ່ງອອກທົ່ວໂລກ" };
  function scopeList(it) {
    return String(it.scope || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function setScopeBoxes(list, shipBranch) {
    document.querySelectorAll(".scope").forEach(function (c) { c.checked = list.indexOf(c.value) >= 0; });
    $("mShipBranch").checked = !!shipBranch;
  }

  function resetForm() {
    editingRow = null;
    setScopeBoxes([], false);
    $("mName").value = "";
    $("mPrice").value = "";
    $("mDesc").value = "";
    $("mWeight").value = "";
    $("mCbm").value = "";
    $("mImg").value = "";
    $("mPreview").classList.add("hidden");
    $("mPreview").removeAttribute("src");
    $("menuFormTitle").textContent = "ເພີ່ມສິນຄ້າໃໝ່";

    $("mSave").disabled = false;
  }

  function startEdit(it) {
    editingRow = it.row;
    $("mName").value = it.itemName;
    $("mPrice").value = it.price;
    $("mCat").value = catOf(it) || MENU_CATS[0];
    $("mDesc").value = it.description || "";
    $("mWeight").value = it.weightKg || "";
    $("mCbm").value = it.cbm || "";
    setScopeBoxes(scopeList(it), it.shipBranch === "yes");
    $("menuFormTitle").textContent = "ແກ້ໄຂສິນຄ້າ";
    $("mCancel").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function menuCall(extra) {
    try {
      return await apiPost(Object.assign({ type: "menusave", shopName: session.shopName, pin: session.pin }, extra));
    } catch (e) {
      return null;
    }
  }

  $("mImg").onchange = function () {
    const f = $("mImg").files[0];
    if (!f) { $("mPreview").classList.add("hidden"); return; }
    $("mPreview").src = URL.createObjectURL(f);
    $("mPreview").classList.remove("hidden");
  };

  // ===== ເຄື່ອງຄິດເລກໃນຊ່ອງນ້ຳໜັກ / CBM =====
  // ຮັບສູດເຊັ່ນ 0.5*0.4*0.3, 0,5 x 0,4 x 0,3, =0.6*0.2*1, (1+2)*3 ແລະ ຄຳນວນເອງ (ບໍ່ໃຊ້ eval)
  function evalExpr(src) {
    let s = String(src || "").trim().replace(/^=/, "").replace(/,/g, ".")
      .replace(/[xX×]/g, "*").replace(/÷/g, "/").replace(/\s+/g, "");
    if (!s) return NaN;
    if (!/^[0-9.+\-*/()]+$/.test(s)) return NaN;
    let pos = 0;
    function peek() { return s.charAt(pos); }
    function parseExpr() {
      let v = parseTerm();
      while (peek() === "+" || peek() === "-") {
        const op = s.charAt(pos++);
        const r = parseTerm();
        v = op === "+" ? v + r : v - r;
      }
      return v;
    }
    function parseTerm() {
      let v = parseFactor();
      while (peek() === "*" || peek() === "/") {
        const op = s.charAt(pos++);
        const r = parseFactor();
        v = op === "*" ? v * r : v / r;
      }
      return v;
    }
    function parseFactor() {
      if (peek() === "-") { pos++; return -parseFactor(); }
      if (peek() === "(") {
        pos++;
        const v = parseExpr();
        if (peek() !== ")") throw new Error("paren");
        pos++;
        return v;
      }
      const m = s.slice(pos).match(/^(\d+\.?\d*|\.\d+)/);
      if (!m) throw new Error("num");
      pos += m[0].length;
      return parseFloat(m[0]);
    }
    try {
      const v = parseExpr();
      if (pos !== s.length || !isFinite(v)) return NaN;
      return v;
    } catch (e) {
      return NaN;
    }
  }
  function calcField(input) {
    const raw = input.value.trim();
    if (raw === "") return;
    const v = evalExpr(raw);
    if (isNaN(v) || v < 0) {
      input.style.borderColor = "#dc2626";
      return;
    }
    input.style.borderColor = "";
    input.value = String(Math.round(v * 10000) / 10000);
  }
  ["mWeight", "mCbm"].forEach(function (id) {
    const el = $(id);
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); calcField(el); }
    });
    el.addEventListener("blur", function () { calcField(el); });
  });

  $("mSave").onclick = async function () {
    calcField($("mWeight"));
    calcField($("mCbm"));
    const item = {
      itemName: $("mName").value.trim(),
      price: Number($("mPrice").value),
      category: $("mCat").value,
      description: $("mDesc").value.trim(),
      weightKg: Number($("mWeight").value),
      cbm: Number($("mCbm").value),
      scope: Array.from(document.querySelectorAll(".scope:checked")).map(function (c) { return c.value; }).join(","),
      shipBranch: $("mShipBranch").checked ? "yes" : "no"
    };
    if (!item.scope) { $("mMsg").textContent = "ເລືອກຂອບເຂດການຂາຍຢ່າງໜ້ອຍ 1 ຂໍ້"; return; }
    if (!item.itemName || !(item.price > 0)) { $("mMsg").textContent = "ໃສ່ຊື່ ແລະ ລາຄາໃຫ້ຄົບ"; return; }
    if (!(item.weightKg > 0) || !(item.cbm > 0)) { $("mMsg").textContent = "ໃສ່ນ້ຳໜັກ ແລະ ຂະໜາດ (CBM) ໃຫ້ຄົບ"; return; }
    $("mSave").disabled = true;
    $("mMsg").textContent = "ກຳລັງບັນທຶກ...";

    const res = editingRow
      ? await menuCall({ action: "update", row: editingRow, item: item })
      : await menuCall({ action: "add", item: item });
    if (!res || !res.ok) {
      $("mMsg").textContent = "ບັນທຶກບໍ່ໄດ້ ລອງໃໝ່";
      $("mSave").disabled = false;
      return;
    }

    let msgTxt = "ບັນທຶກແລ້ວ";
    const row = editingRow || res.row;
    const file = $("mImg").files[0];
    if (file) {
      try {
        const b64 = await shrinkImage(file);
        const up = await apiPost({ type: "menuimage", shopName: session.shopName, pin: session.pin, row: row, imageBase64: b64 });
        if (!up || !up.ok) msgTxt = "ບັນທຶກສິນຄ້າແລ້ວ ແຕ່ອັບໂຫຼດຮູບບໍ່ໄດ້";
      } catch (e) {
        msgTxt = "ບັນທຶກສິນຄ້າແລ້ວ ແຕ່ອັບໂຫຼດຮູບບໍ່ໄດ້";
      }
    }
    resetForm();
    await loadMenu();
    $("mMsg").textContent = msgTxt;
  };

  $("mCancel").onclick = resetForm;

  $("menuList").addEventListener("click", async function (ev) {
    const b = ev.target.closest("button[data-m]");
    if (!b) return;
    const row = Number(b.dataset.row);
    const it = menuItems.find(function (x) { return x.row === row; });
    if (!it) return;
    if (b.dataset.m === "edit") { startEdit(it); return; }
    if (b.dataset.m === "delete") {
      if (!confirm("ລົບ " + it.itemName + " ແທ້ບໍ?")) return;
      await menuCall({ action: "delete", row: row });
    } else if (b.dataset.m === "soldout") {
      await menuCall({ action: "soldout", row: row, soldOut: b.dataset.soldout === "1" });
    }
    await loadMenu();
  });

  $("tabOrders").onclick = function () { showTab("orders"); };
  $("tabMenu").onclick = function () { showTab("menu"); };
  $("tabSettings").onclick = function () { showTab("settings"); };
  fillCats();

  // ===== ໜ້າຕັ້ງຄ່າຮ້ານ =====
  const ADMIN_WA = "8562023949789"; // ເບີ WhatsApp ທີມງານແອັບ LLUX
  let geo = { lat: "", lng: "" };

  function showGeo() {
    $("sGeo").textContent = geo.lat === "" ? "ຍັງບໍ່ໄດ້ຕັ້ງຕຳແໜ່ງ" : Number(geo.lat).toFixed(6) + ", " + Number(geo.lng).toFixed(6);
  }

  async function settingsCall(extra) {
    try {
      return await apiPost(Object.assign({ type: "shopinfosave", shopName: session.shopName, pin: session.pin }, extra));
    } catch (e) {
      return null;
    }
  }

  async function loadSettings() {
    if (!session) return;
    try {
      const data = await apiGet({ type: "shopinfo", shopName: session.shopName, pin: session.pin });
      if (data && data.error === "auth") { logout(); return; }
      $("sName").textContent = data.name || "-";
      $("sNameNote").textContent = data.pendingName ? "ລໍຖ້າອະນຸມັດປ່ຽນເປັນ: " + data.pendingName : "";
      $("sPhone").value = data.phone || "";
      $("sEmail").value = data.email || "";
      $("sAddr").value = data.address || "";
      geo = { lat: data.lat, lng: data.lng };
      showGeo();
      if (data.imageUrl) { $("sPhotoPrev").src = data.imageUrl; $("sPhotoPrev").classList.remove("hidden"); }
      if (ADMIN_WA) { $("sAdmin").href = "https://wa.me/" + ADMIN_WA; $("sAdmin").classList.remove("hidden"); }
    } catch (e) {
      $("sMsg").textContent = "ໂຫຼດຂໍ້ມູນຮ້ານບໍ່ໄດ້";
    }
    loadProfile();
  }

  // ===== ໂປຣໄຟລ໌ຮ້ານ ແລະ ເອກະສານ =====
  const DOC_LABEL = { registration: "ໃບທະບຽນວິສາຫະກິດ", license: "ໃບອະນຸຍາດດຳເນີນທຸລະກິດ", other: "ເອກະສານອື່ນ" };
  const DOC_MAX = 5 * 1024 * 1024;
  let profileComplete = false;
  let docsCache = [];

  function escH(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function needsDocs() {
    return $("sBiz").value !== "individual" || $("sHasStore").value === "yes";
  }
  function renderDocNote() {
    if (!needsDocs()) { $("sDocNote").textContent = "ຮ້ານນີ້ບໍ່ບັງຄັບເອກະສານ (ອັບໂຫຼດເພີ່ມໄດ້ຖ້າຕ້ອງການ)"; return; }
    $("sDocNote").textContent = profileComplete ? "✔ ເອກະສານບັງຄັບຄົບແລ້ວ" : "⚠ ຍັງຂາດເອກະສານບັງຄັບ: ໃບທະບຽນ ແລະ ໃບອະນຸຍາດ";
  }
  function renderDocs(docs) {
    docsCache = docs;
    $("sDocList").innerHTML = docs.length ? docs.map(function (x, i) {
      return '<div class="docrow" style="margin:6px 0;"><a href="' + escH(x.url) + '" target="_blank" rel="noopener">' +
        escH(DOC_LABEL[x.type] || x.type) + (x.name ? ' · ' + escH(x.name) : '') + '</a> ' +
        '<button class="secondary" data-del="' + i + '">ລຶບ</button></div>';
    }).join("") : '<p class="muted small">ຍັງບໍ່ມີເອກະສານ</p>';
  }
  async function loadProfile() {
    if (!session) return;
    try {
      const d = await apiGet({ type: "shopprofile", shop: session.shopName });
      if (!d || !d.ok) return;
      $("sBiz").value = d.bizType || "individual";
      $("sHasStore").value = d.hasStore ? "yes" : "no";
      $("sEmp").value = d.employees || "";
      $("sDesc").value = d.description || "";
      profileComplete = !!d.complete;
      renderDocs(d.docs || []);
      renderDocNote();
    } catch (e) {}
  }

  $("sProfileSave").onclick = async function () {
    $("sProfileSave").disabled = true;
    $("sProfileMsg").textContent = "ກຳລັງບັນທຶກ...";
    let res = null;
    try {
      res = await apiPost({
        type: "profilesave", shopName: session.shopName, pin: session.pin,
        bizType: $("sBiz").value, hasStore: $("sHasStore").value === "yes",
        employees: $("sEmp").value, description: $("sDesc").value.trim()
      });
    } catch (e) {}
    $("sProfileSave").disabled = false;
    if (!res || !res.ok) {
      const reasons = { auth: "PIN ບໍ່ຖືກຕ້ອງ", employees: "ກະລຸນາໃສ່ຈຳນວນພະນັກງານ", description: "ແນະນຳຮ້ານຍາວເກີນໄປ", bizType: "ປະເພດບໍ່ຖືກຕ້ອງ" };
      $("sProfileMsg").textContent = reasons[res && res.reason] || "ບັນທຶກບໍ່ໄດ້ ລອງໃໝ່";
      return;
    }
    profileComplete = !!res.complete;
    renderDocNote();
    $("sProfileMsg").textContent = profileComplete ? "ບັນທຶກແລ້ວ" : "ບັນທຶກແລ້ວ ແຕ່ຍັງຂາດເອກະສານບັງຄັບ";
  };

  function readB64(file) {
    return new Promise(function (resolve, reject) {
      const r = new FileReader();
      r.onerror = reject;
      r.onload = function () { resolve(String(r.result).split(",")[1]); };
      r.readAsDataURL(file);
    });
  }
  async function uploadDoc(docType, file) {
    if (file.size > DOC_MAX) return "ໄຟລ໌ໃຫຍ່ເກີນ 5MB";
    let b64, mime;
    try {
      if (file.type === "application/pdf") { b64 = await readB64(file); mime = "application/pdf"; }
      else { b64 = await shrinkImage(file); mime = "image/jpeg"; }
    } catch (e) { return "ອ່ານໄຟລ໌ບໍ່ໄດ້"; }
    let res = null;
    try {
      res = await apiPost({ type: "shopdoc", shopName: session.shopName, pin: session.pin, docType: docType, mime: mime, fileName: file.name, fileBase64: b64 });
    } catch (e) {}
    if (!res || !res.ok) return "ອັບໂຫຼດບໍ່ໄດ້ (" + ((res && res.reason) || "error") + ")";
    return null;
  }
  ["sDocRegistration", "sDocLicense", "sDocOther"].forEach(function (id) {
    $(id).onchange = async function () {
      const files = Array.from(this.files || []);
      this.value = "";
      if (!files.length || !session) return;
      const docType = id === "sDocRegistration" ? "registration" : (id === "sDocLicense" ? "license" : "other");
      $("sDocMsg").textContent = "ກຳລັງອັບໂຫຼດ...";
      let err = null;
      for (const f of files) {
        const e = await uploadDoc(docType, f);
        if (e) err = e;
      }
      $("sDocMsg").textContent = err || "ອັບໂຫຼດແລ້ວ";
      await loadProfile();
    };
  });
  $("sBiz").onchange = renderDocNote;
  $("sHasStore").onchange = renderDocNote;
  $("sDocList").addEventListener("click", async function (e) {
    const b = e.target.closest("[data-del]");
    if (!b || !session) return;
    const doc = docsCache[Number(b.dataset.del)];
    if (!doc || !confirm("ລຶບເອກະສານນີ້?")) return;
    let res = null;
    try {
      res = await apiPost({ type: "shopdocdel", shopName: session.shopName, pin: session.pin, docUrl: doc.url });
    } catch (err) {}
    $("sDocMsg").textContent = res && res.ok ? "ລຶບແລ້ວ" : "ລຶບບໍ່ໄດ້";
    await loadProfile();
  });

  $("sPhoto").onchange = function () {
    const f = $("sPhoto").files[0];
    if (!f) return;
    $("sPhotoPrev").src = URL.createObjectURL(f);
    $("sPhotoPrev").classList.remove("hidden");
  };

  $("sGeoBtn").onclick = function () {
    if (!navigator.geolocation) { $("sGeo").textContent = "ເບຣາວເຊີນີ້ບໍ່ຮອງຮັບຕຳແໜ່ງ"; return; }
    $("sGeo").textContent = "ກຳລັງຫາຕຳແໜ່ງ...";
    navigator.geolocation.getCurrentPosition(function (pos) {
      geo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      showGeo();
    }, function () {
      $("sGeo").textContent = "ຫາຕຳແໜ່ງບໍ່ໄດ້ ກະລຸນາອະນຸຍາດການເຂົ້າເຖິງຕຳແໜ່ງ";
    }, { enableHighAccuracy: true, timeout: 15000 });
  };

  $("sSave").onclick = async function () {
    $("sSave").disabled = true;
    $("sMsg").textContent = "ກຳລັງບັນທຶກ...";
    const res = await settingsCall({
      action: "save",
      phone: $("sPhone").value,
      email: $("sEmail").value.trim(),
      address: $("sAddr").value.trim(),
      lat: geo.lat,
      lng: geo.lng
    });
    if (!res || !res.ok) {
      const reasons = { phone: "ເບີໂທບໍ່ຖືກຕ້ອງ", email: "ອີເມວບໍ່ຖືກຕ້ອງ", location: "ຕຳແໜ່ງບໍ່ຖືກຕ້ອງ", auth: "PIN ບໍ່ຖືກຕ້ອງ" };
      $("sMsg").textContent = reasons[res && res.reason] || "ບັນທຶກບໍ່ໄດ້ ລອງໃໝ່";
      $("sSave").disabled = false;
      return;
    }

    let msg = "ບັນທຶກແລ້ວ";
    const f = $("sPhoto").files[0];
    if (f) {
      try {
        const b64 = await shrinkImage(f);
        const up = await apiPost({ type: "shopphoto", shopName: session.shopName, pin: session.pin, imageBase64: b64 });
        if (!up || !up.ok) msg = "ບັນທຶກແລ້ວ ແຕ່ອັບໂຫຼດຮູບບໍ່ໄດ້";
        else $("sPhoto").value = "";
      } catch (e) {
        msg = "ບັນທຶກແລ້ວ ແຕ່ອັບໂຫຼດຮູບບໍ່ໄດ້";
      }
    }
    $("sSave").disabled = false;
    $("sMsg").textContent = msg;
    loadSettings();
  };

  $("sNameBtn").onclick = async function () {
    const nn = $("sNewName").value.trim();
    if (!nn) { $("sNameMsg").textContent = "ໃສ່ຊື່ໃໝ່ກ່ອນ"; return; }
    if (!confirm("ສົ່ງຄຳຂໍປ່ຽນຊື່ເປັນ \"" + nn + "\" ໃຫ້ແອດມິນ LLUX ອະນຸມັດ?")) return;
    const res = await settingsCall({ action: "requestName", newName: nn });
    $("sNameMsg").textContent = res && res.ok ? "ສົ່ງຄຳຂໍແລ້ວ ລໍຖ້າແອດມິນອະນຸມັດ" : "ສົ່ງບໍ່ໄດ້ ລອງໃໝ່";
    if (res && res.ok) $("sNewName").value = "";
    loadSettings();
  };

  setInterval(tickCountdown, 1000);
  updateNotifyState();
  loadShops();
  try {
    const saved = JSON.parse(localStorage.getItem("llux_shop") || "null");
    if (saved && saved.shopName && saved.pin) {
      session = saved;
      afterLogin();
    }
  } catch (e) { /* ບໍ່ມີຂໍ້ມູນທີ່ບັນທຶກໄວ້ */ }
</script>
</body>
