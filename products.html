<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LLUX ສິນຄ້າ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --red:#d62828; --red2:#ff5a36; --ink:#1d2330; --mute:#6b7280; --line:#e5e7eb; --bg:#f5f5f6; --ok:#16a34a; }
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: var(--bg); margin: 0; color: var(--ink); padding-bottom: 76px; }
  button, input { font-family: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* ===== ແຖບເທິງ ===== */
  .top { position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg, var(--red), var(--red2)); padding: 12px 12px 14px; }
  .bar { display: flex; align-items: center; gap: 10px; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 10px; padding: 0 12px; height: 42px; }
  .search input { flex: 1; border: none; outline: none; font-size: 16px; background: transparent; min-width: 0; }
  .cam { font-size: 18px; cursor: pointer; display: flex; align-items: center; padding: 0 2px; }
  .imgchip { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 10px; padding: 6px 8px; margin-top: 10px; font-size: 13px; }
  .imgchip.hidden { display: none; }
  .imgchip img { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; }
  .imgchip span { flex: 1; }
  .imgchip button { border: none; background: #f2f2f2; border-radius: 8px; width: 28px; height: 28px; cursor: pointer; }
  .icon { position: relative; width: 40px; height: 40px; border: none; border-radius: 10px; background: rgba(255,255,255,.18); color: #fff; font-size: 20px; cursor: pointer; flex: 0 0 auto; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #fff; color: var(--red); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; display: none; }
  .badge.on { display: block; }

  /* ===== ແຖບໂປຣໂມຊັນ ===== */
  .promos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px; }
  .promo { background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--mute); }
  .promo b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }

  /* ===== ໝວດໝູ່ ===== */
  .cats { display: flex; gap: 6px; overflow-x: auto; padding: 12px; background: #fff; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat { flex: 0 0 auto; width: 74px; border: none; background: none; cursor: pointer; text-align: center; color: var(--ink); font-size: 12px; padding: 0; }
  .cat .ic { width: 52px; height: 52px; margin: 0 auto 4px; border-radius: 16px; background: #fff3f2; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid #ffd9d4; }
  .cat.on .ic { background: var(--red); border-color: var(--red); }
  .cat.on span { color: var(--red); font-weight: 700; }
  .cat span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== ແບນເນີ ===== */
  .banner { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 12px 12px 0; border-radius: 14px; }
  .banner::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: start; position: relative; aspect-ratio: 16 / 8; background: #fff; overflow: hidden; }
  .slide img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .slide .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; background: rgba(255,255,255,.93); color: var(--ink); }
  .slide .cap b { display: block; font-size: 16px; }
  .slide .cap span { font-size: 14px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: #cbd5e1; }
  .dot.on { width: 16px; background: var(--red); }

  /* ===== ຫົວຂໍ້ + ກຣິດສິນຄ້າ ===== */
  .sec { display: flex; justify-content: space-between; align-items: center; padding: 16px 12px 4px; }
  .sec h2 { font-size: 16px; margin: 0; }
  .sec small { color: var(--mute); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 12px 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: #fff; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.05); position: relative; }
  .imgwrap { position: relative; aspect-ratio: 1 / 1; background: #eee; }
  .imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag { position: absolute; left: 6px; top: 6px; background: var(--ok); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px; }
  .sold { position: absolute; inset: 0; background: rgba(0,0,0,.45); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .body { padding: 8px 10px 10px; display: flex; flex-direction: column; flex: 1; }
  .name { font-size: 14px; line-height: 1.35; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; }
  .price { color: var(--red); font-weight: 700; font-size: 16px; }
  .meta { font-size: 12px; color: var(--mute); margin-top: 4px; line-height: 1.4; }
  .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .add { width: 34px; height: 34px; border: none; border-radius: 50%; background: var(--red); color: #fff; font-size: 20px; line-height: 34px; cursor: pointer; }
  .add:disabled { background: #cbd5e1; }
  .empty { text-align: center; color: var(--mute); padding: 40px 12px; font-size: 15px; }
  .hidden { display: none !important; }

  /* ===== ແຖບລຸ່ມ ===== */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: flex; z-index: 6; padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { flex: 1; border: none; background: none; padding: 8px 0 10px; font-size: 12px; color: var(--mute); cursor: pointer; position: relative; }
  .tabs button .e { display: block; font-size: 20px; line-height: 1.2; }
  .tabs button.on { color: var(--red); font-weight: 700; }
  .tabs .badge { top: 2px; left: 55%; }

  /* ===== ໜ້າຕ່າງ (ລາຍລະອຽດ / ຕະກ້າ) ===== */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .overlay.on { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 620px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px; }
  .sheet .main { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; background: #eee; display: block; }
  .sheet h2 { font-size: 19px; margin: 12px 0 6px; }
  .shoplink { color: var(--red); font-weight: 600; text-decoration: none; }
  .comap { height: 240px; border-radius: 12px; margin: 8px 0; }
  .dtype { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .dt { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mute); }
  .dt b { font-size: 14px; color: var(--ink); }
  .dt.on { border-color: var(--red); background: #fff5f5; }
  .dt:disabled { opacity: .45; cursor: not-allowed; }
  .sheet .r { margin: 6px 0; font-size: 15px; color: #374151; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }
  .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; background: #eee; }
  .qty { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  .qty button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 18px; cursor: pointer; }
  .btn { width: 100%; padding: 13px; border: none; border-radius: 12px; background: var(--red); color: #fff; font-size: 16px; font-weight: 700; margin-top: 12px; cursor: pointer; }
  .btn.ghost { background: #374151; }
  .btn:disabled { background: #cbd5e1; }

  .cgroup { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .cgroup .gh { background: #fff7f6; padding: 10px 12px; display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; }
  .citem { display: flex; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: center; }
  .citem img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #eee; flex: 0 0 auto; }
  .citem .ci { flex: 1; min-width: 0; }
  .citem .cn { font-size: 14px; }
  .citem .cp { font-size: 13px; color: var(--mute); }
  .citem .qs { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .citem .qs button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .citem .rm { border: none; background: none; color: var(--red); font-size: 13px; cursor: pointer; padding: 4px; }
  .total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin: 12px 0 4px; }
  .note { font-size: 13px; color: var(--mute); line-height: 1.5; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }
  .cr { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; cursor: pointer; text-align: left; color: var(--ink); }
  .cr.on { border-color: var(--red); color: var(--red); font-weight: 700; }
  .cr small { color: var(--mute); font-size: 13px; }
  .inp { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; }
  .lbl { display: block; font-size: 14px; color: var(--mute); margin-top: 12px; }
</style>
<script src="categories.js"></script>
</head>
<body>
<div class="wrap">

  <!-- ແຖບເທິງ: ຄົ້ນຫາ · ແຊັດ · ຕະກ້າ -->
  <header class="top">
    <div class="bar">
      <div class="search">
        <span>🔍</span>
        <input id="q" type="search" placeholder="ຄົ້ນຫາສິນຄ້າ ຫຼື ຮ້ານ">
        <label class="cam" title="ຄົ້ນຫາດ້ວຍຮູບ">📷<input id="qImg" type="file" accept="image/*" hidden></label>
      </div>
      <button class="icon" id="btnChat" title="ແຊັດກັບ LLUX">💬</button>
      <button class="icon" id="btnCartTop" title="ຕະກ້າ">🛒<span class="badge" id="badgeTop">0</span></button>
    </div>
    <div class="imgchip hidden" id="imgChip">
      <img id="imgThumb" alt="">
      <span>ຄົ້ນຫາດ້ວຍຮູບ</span>
      <button type="button" id="imgClear">✕</button>
    </div>
  </header>

  <!-- ໂປຣໂມຊັນ / ຂໍ້ມູນ -->
  <div class="promos">
    <div class="promo"><b>ຄ່າສົ່ງໂປ່ງໃສ</b>3,500 ກີບ/ກມ (7 ກມ ທຳອິດ)</div>
    <div class="promo"><b>ຊື້ຈາກຫຼາຍຮ້ານ</b>ຄ່າສົ່ງລວມຄັ້ງດຽວ</div>
  </div>

  <!-- ໝວດໝູ່ -->
  <nav class="cats" id="cats"></nav>

  <!-- ແບນເນີສິນຄ້າ -->
  <div class="banner" id="banner"></div>
  <div class="dots" id="dots"></div>

  <!-- ລາຍການສິນຄ້າ -->
  <div class="sec"><h2 id="secTitle">ສິນຄ້າແນະນຳ</h2><small id="count"></small></div>
  <p id="msg" class="empty">ກຳລັງໂຫຼດສິນຄ້າ...</p>
  <div class="grid" id="grid"></div>

</div>

<!-- ແຖບລຸ່ມ -->
<nav class="tabs">
  <button class="on" id="tHome"><span class="e">🏠</span>ໜ້າຫຼັກ</button>
  <button id="tCat"><span class="e">🗂️</span>ໝວດໝູ່</button>
  <button id="tCart"><span class="e">🛒</span>ຕະກ້າ<span class="badge" id="badgeTab">0</span></button>
  <button id="tTrack"><span class="e">📦</span>ຕິດຕາມ</button>
  <button id="tMe"><span class="e">👤</span>ຂ້ອຍ</button>
</nav>

<div class="toast" id="toast"></div>

<!-- ລາຍລະອຽດສິນຄ້າ -->
<div class="overlay" id="ovDetail"><div class="sheet" id="sheetDetail"></div></div>
<!-- ຕະກ້າ -->
<div class="overlay" id="ovCart"><div class="sheet" id="sheetCart"></div></div>
<!-- ສັ່ງຊື້ -->
<div class="overlay" id="ovCheckout"><div class="sheet" id="sheetCheckout"></div></div>
<!-- ໜ້າຕ່າງທົ່ວໄປ: ໝວດໝູ່ / ຕິດຕາມ / ບັນຊີ -->
<div class="overlay" id="ovInfo"><div class="sheet" id="sheetInfo"></div></div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbySjDcvpFS8AD4NkOGlv06LQfTWQ9WBCxh72XM8d-TNI4yRsyaIkMz_lg78DN0ccqSaBQ/exec";
  const ADMIN_WA = "8562023949789";
  const ALL = "ທັງໝົດ";
  // ໄອຄອນຕາມຊື່ໝວດ (ບໍ່ໃຊ້ລຳດັບ)
  function iconFor(name) {
    const hit = LLUX_CATEGORIES.find(function (x) { return x.name === name; });
    if (hit) return hit.icon;
    const n = String(name || "");
    if (n.indexOf("ເຈ້ຍ") >= 0 || /a4/i.test(n)) return "📄";
    if (n.indexOf("ນໍ້າມັນ") >= 0) return "🫒";
    if (n.indexOf("ລ້າງຈານ") >= 0) return "🍽️";
    if (n.indexOf("ຊັກ") >= 0) return "🧺";
    if (n.indexOf("ນໍ້າຢາ") >= 0 || n.indexOf("ລ້າງ") >= 0) return "🧴";
    if (n.indexOf("ເສື້ອ") >= 0 || n.indexOf("ຜ້າ") >= 0) return "👕";
    if (n.indexOf("ໂທລະສັບ") >= 0 || n.indexOf("ມືຖື") >= 0) return "📱";
    if (n.indexOf("ເຄື່ອງ") >= 0 || n.indexOf("ບ້ານ") >= 0) return "🏠";
    return "📦";
  }
  const RIDER_KMH = 30;

  // ລິ້ງຊື່ຮ້ານ ໄປໜ້າໂປຣໄຟລ໌ຮ້ານ (ຢຸດບໍ່ໃຫ້ການກົດເປີດລາຍລະອຽດສິນຄ້າ)
  function shopLink(n) {
    return '<a class="shoplink" href="shop.html?shop=' + encodeURIComponent(n) + '" onclick="event.stopPropagation()">' + esc(n) + ' ›</a>';
  }

  let items = [];          // ສິນຄ້າທັງໝົດ
  let shops = {};          // ຂໍ້ມູນຮ້ານ: ຊື່ -> { km, eta }
  let shown = [];          // ສິນຄ້າທີ່ສະແດງຢູ່
  let cat = ALL;
  let myPos = null;

  const $ = (id) => document.getElementById(id);
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function money(n) { return Number(n || 0).toLocaleString("en-US") + " ກີບ"; }
  function distKm(a, b, c, d) {
    const R = 6371, t = (x) => x * Math.PI / 180;
    const dLat = t(c - a), dLng = t(d - b);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  // ===== ຕະກ້າ (ເກັບໃນເຄື່ອງນີ້) =====
  function getCart() { try { return JSON.parse(localStorage.getItem("llux_cart") || "[]"); } catch (e) { return []; } }
  function setCart(c) { try { localStorage.setItem("llux_cart", JSON.stringify(c)); } catch (e) {} updateBadges(); }
  function cartCount() { return getCart().reduce(function (s, x) { return s + x.qty; }, 0); }
  function updateBadges() {
    const n = cartCount();
    ["badgeTop", "badgeTab"].forEach(function (id) {
      $(id).textContent = n;
      $(id).classList.toggle("on", n > 0);
    });
  }
  function addToCart(item, qty) {
    const c = getCart();
    const f = c.find(function (x) { return x.shopName === item.shopName && x.itemName === item.itemName; });
    if (f) f.qty = Math.min(99, f.qty + qty);
    else c.push({ shopName: item.shopName, itemName: item.itemName, price: item.price, imageUrl: item.imageUrl || "", weightKg: item.weightKg || 0, cbm: item.cbm || 0, qty: qty });
    setCart(c);
    toast("ເພີ່ມເຂົ້າຕະກ້າແລ້ວ");
  }
  function toast(t) {
    $("toast").textContent = t;
    $("toast").classList.add("on");
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { $("toast").classList.remove("on"); }, 1400);
  }

  // ===== ໂຫຼດຂໍ້ມູນ =====
  async function load() {
    try {
      const r = await fetch(API + "?type=products", { cache: "no-store" });
      const data = await r.json();
      items = Array.isArray(data) ? data : [];
      items.forEach(function (i) { i.cat = catOf(i); });
    } catch (e) {
      $("msg").textContent = "ໂຫຼດສິນຄ້າບໍ່ໄດ້ ລອງໃໝ່ອີກຄັ້ງ";
      return;
    }
    renderCats();
    renderBanner();
    render();
    loadShops();
  }

  // ຮ້ານ + ໄລຍະທາງ/ເວລາຖືງ (ຖ້າອະນຸຍາດຕຳແໜ່ງ)
  async function loadShops() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(async function (p) {
      myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
      try {
        const r = await fetch(API, { cache: "no-store" });
        const list = await r.json();
        (Array.isArray(list) ? list : []).forEach(function (s) {
          const lat = Number(s.lat), lng = Number(s.lng);
          if (isNaN(lat) || isNaN(lng)) return;
          const km = distKm(myPos.lat, myPos.lng, lat, lng);
          shops[s.shopName] = {
            km: Math.round(km * 10) / 10,
            eta: Math.round((Number(s.prepMinutes) || 0) + (km / RIDER_KMH) * 60)
          };
        });
        render();
      } catch (e) {}
    }, function () {}, { timeout: 8000 });
  }

  // ===== ໝວດໝູ່ =====
  function renderCats() {
    const names = [ALL].concat(LLUX_CATEGORIES.map(function (c) { return c.name; }));
    $("cats").innerHTML = names.map(function (c, idx) {
      const icon = c === ALL ? "🛍️" : iconFor(c);
      return '<button class="cat' + (c === cat ? " on" : "") + '" data-cat="' + esc(c) + '">' +
        '<div class="ic">' + icon + '</div><span>' + esc(c) + '</span></button>';
    }).join("");
  }

  // ===== ແບນເນີ: ສິນຄ້າແນະນຳ 3 ລາຍການແລກ =====
  function renderBanner() {
    const picks = items.filter(function (i) { return i.imageUrl; }).slice(0, 3);
    if (picks.length === 0) {
      $("banner").innerHTML = '<div class="slide"><div class="cap"><b>LLUX ສິນຄ້າຄຸນນະພາບ</b><span>ສັ່ງຈາກຫຼາຍຮ້ານໃນຄັ້ງດຽວ</span></div></div>';
    } else {
      $("banner").innerHTML = picks.map(function (i) {
        return '<div class="slide"><img src="' + esc(i.imageUrl) + '" alt=""><div class="cap"><b>' + esc(i.itemName) +
          '</b><span>' + money(i.price) + ' · ' + esc(i.shopName) + '</span></div></div>';
      }).join("");
    }
    const n = Math.max(1, picks.length);
    $("dots").innerHTML = Array.from({ length: n }, function (_, k) { return '<span class="dot' + (k === 0 ? " on" : "") + '"></span>'; }).join("");
  }
  $("banner").addEventListener("scroll", function () {
    const w = $("banner").clientWidth || 1;
    const k = Math.round($("banner").scrollLeft / w);
    Array.from($("dots").children).forEach(function (d, idx) { d.classList.toggle("on", idx === k); });
  });

  // ===== ຄົ້ນຫາດ້ວຍຮູບ =====
  // ປິດໄວ້ຈົນກວ່າຈະເຊື່ອມ AI: ເມື່ອພ້ອມ ຕັ້ງເປັນ true ແລ້ວເຊື່ອມກັບ backend ຕອນນັ້ນ
  const AI_IMAGE_SEARCH = false;
  let imgSearchFile = null;

  $("qImg").onchange = function () {
    const f = this.files && this.files[0];
    this.value = "";
    if (!f) return;
    imgSearchFile = f;
    $("imgThumb").src = URL.createObjectURL(f);
    $("imgChip").classList.remove("hidden");
    if (!AI_IMAGE_SEARCH) toast("ການຄົ້ນຫາດ້ວຍຮູບຈະເປີດໃຊ້ໃນໄວໆນີ້");
  };
  $("imgClear").onclick = function () {
    imgSearchFile = null;
    $("imgChip").classList.add("hidden");
    render();
  };

  // ===== ສະແດງສິນຄ້າ =====
  function render() {
    const q = $("q").value.trim().toLowerCase();
    shown = items.filter(function (i) {
      if (cat !== ALL && i.cat !== cat) return false;
      if (!q) return true;
      return (i.itemName + " " + i.shopName + " " + i.category + " " + i.description).toLowerCase().indexOf(q) >= 0;
    });
    $("secTitle").textContent = cat === ALL ? "ສິນຄ້າແນະນຳ" : cat;
    $("count").textContent = shown.length ? shown.length + " ລາຍການ" : "";
    if (items.length === 0) $("msg").textContent = "ຍັງບໍ່ມີສິນຄ້າໃນລະບົບ";
    else if (cat !== ALL) $("msg").textContent = "ຍັງບໍ່ພົບສິນຄ້າໃນໝວດນີ້ໃນລະບົບ";
    else $("msg").textContent = "ບໍ່ພົບສິນຄ້າ";
    $("msg").classList.toggle("hidden", shown.length > 0);
    $("grid").innerHTML = shown.map(function (i, idx) {
      const s = shops[i.shopName];
      const meta = s ? '📍 ' + s.km + ' ກມ · ~' + s.eta + ' ນາທີ' : esc(i.shopName);
      const isOut = i.status === "soldout";
      return '<div class="card" data-idx="' + idx + '">' +
        '<div class="imgwrap">' +
          (i.imageUrl ? '<img loading="lazy" src="' + esc(i.imageUrl) + '" alt="">' : '') +
          '<span class="tag">✔ ຮ້ານຢືນຢັນ</span>' +
          (isOut ? '<div class="sold">ໝົດແລ້ວ</div>' : '') +
        '</div>' +
        '<div class="body">' +
          '<p class="name">' + esc(i.itemName) + '</p>' +
          '<div class="price">' + money(i.price) + '</div>' +
          '<div class="meta">' + meta + '</div>' +
          '<div class="row2"><span class="meta">' + shopLink(i.shopName) + '</span>' +
            '<button class="add" data-add="' + idx + '"' + (isOut ? ' disabled' : '') + '>+</button></div>' +
        '</div></div>';
    }).join("");
  }

  // ===== ລາຍລະອຽດສິນຄ້າ =====
  function openDetail(i) {
    const thumbs = String(i.detailImages || "").split(/[\n,]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    const isOut = i.status === "soldout";
    $("sheetDetail").innerHTML =
      (i.imageUrl ? '<img class="main" src="' + esc(i.imageUrl) + '" alt="">' : '') +
      (thumbs.length ? '<div class="thumbs">' + thumbs.map(function (u) { return '<img src="' + esc(u) + '" alt="">'; }).join("") + '</div>' : '') +
      '<h2>' + esc(i.itemName) + '</h2>' +
      '<div class="r"><b style="color:var(--red)">' + money(i.price) + '</b></div>' +
      '<div class="r">ຮ້ານ: ' + shopLink(i.shopName) + '</div>' +
      (i.cat ? '<div class="r">ໝວດ: ' + esc(i.cat) + '</div>' : '') +
      '<div class="r">ນ້ຳໜັກ: ' + (i.weightKg ? esc(i.weightKg) + ' ກກ' : 'ຍັງບໍ່ລະບຸ') + ' · ຂະໜາດ: ' + (i.cbm ? esc(i.cbm) + ' CBM' : 'ຍັງບໍ່ລະບຸ') + '</div>' +
      (i.origin ? '<div class="r">ແຫຼ່ງຜະລິດ: ' + esc(i.origin) + '</div>' : '') +
      (i.importer ? '<div class="r">ຜູ້ນຳເຂົ້າ: ' + esc(i.importer) + '</div>' : '') +
      (i.description ? '<div class="r">' + esc(i.description) + '</div>' : '') +
      '<div class="qty"><button id="qMinus">−</button><b id="qVal">1</b><button id="qPlus">+</button></div>' +
      '<button class="btn" id="btnAdd"' + (isOut ? ' disabled' : '') + '>' + (isOut ? 'ໝົດແລ້ວ' : 'ເພີ່ມເຂົ້າຕະກ້າ') + '</button>' +
      '<button class="btn ghost" id="btnClose">ປິດ</button>';
    let qty = 1;
    $("qMinus").onclick = function () { qty = Math.max(1, qty - 1); $("qVal").textContent = qty; };
    $("qPlus").onclick = function () { qty = Math.min(99, qty + 1); $("qVal").textContent = qty; };
    $("btnAdd").onclick = function () { addToCart(i, qty); closeAll(); };
    $("btnClose").onclick = closeAll;
    $("ovDetail").classList.add("on");
  }

  // ===== ຕະກ້າ: ຈັດກຸ່ມຕາມຮ້ານ =====
  function openCart() {
    const c = getCart();
    if (c.length === 0) {
      $("sheetCart").innerHTML = '<h2>ຕະກ້າ</h2><p class="note">ຕະກ້າຍັງວ່າງ ເລືອກສິນຄ້າກ່ອນໄດ້ເລີຍ</p><button class="btn ghost" id="btnClose">ປິດ</button>';
    } else {
      const groups = {};
      c.forEach(function (x, idx) {
        (groups[x.shopName] = groups[x.shopName] || []).push({ x: x, idx: idx });
      });
      let total = 0;
      const html = Object.keys(groups).map(function (shop) {
        const rows = groups[shop];
        const sub = rows.reduce(function (s, r) { return s + r.x.price * r.x.qty; }, 0);
        total += sub;
        return '<div class="cgroup"><div class="gh"><span>' + shopLink(shop) + '</span><span>' + money(sub) + '</span></div>' +
          rows.map(function (r) {
            return '<div class="citem">' +
              (r.x.imageUrl ? '<img src="' + esc(r.x.imageUrl) + '" alt="">' : '<div style="width:56px;height:56px;border-radius:8px;background:#eee"></div>') +
              '<div class="ci"><div class="cn">' + esc(r.x.itemName) + '</div><div class="cp">' + money(r.x.price) + '</div>' +
                '<div class="qs"><button data-dec="' + r.idx + '">−</button><b>' + r.x.qty + '</b><button data-inc="' + r.idx + '">+</button>' +
                '<button class="rm" data-rm="' + r.idx + '">ລຶບ</button></div></div></div>';
          }).join("") + '</div>';
      }).join("");
      const sumW = c.reduce(function (s, x) { return s + (Number(x.weightKg) || 0) * x.qty; }, 0);
      const sumC = c.reduce(function (s, x) { return s + (Number(x.cbm) || 0) * x.qty; }, 0);
      $("sheetCart").innerHTML = '<h2>ຕະກ້າ</h2>' + html +
        '<p class="note">ນ້ຳໜັກລວມ ' + sumW.toFixed(2) + ' ກກ · ປະລິມາດລວມ ' + sumC.toFixed(3) + ' CBM (ໃຊ້ເລືອກປະເພດໄຣເດີ)</p>' +
        '<div class="total"><span>ລວມຄ່າສິນຄ້າ</span><span>' + money(total) + '</span></div>' +
        '<p class="note">ຄ່າສົ່ງຈະຄິດຕາມທີ່ຢູ່ຂອງທ່ານ ແລະ ຈ່າຍເປັນຍອດດຽວ. ຈ່າຍເງິນແຕ່ລະຮ້ານແຍກກັນ.</p>' +
        '<button class="btn" id="btnCheckout">ສັ່ງຊື້ · ' + money(total) + '</button>' +
        '<button class="btn ghost" id="btnClose">ປິດ</button>';
    }
    $("btnClose") && ($("btnClose").onclick = closeAll);
    $("btnCheckout") && ($("btnCheckout").onclick = openCheckout);
    $("ovCart").classList.add("on");
  }
  $("sheetCart").addEventListener("click", function (e) {
    const t = e.target;
    const c = getCart();
    if (t.dataset.inc != null) c[t.dataset.inc].qty = Math.min(99, c[t.dataset.inc].qty + 1);
    else if (t.dataset.dec != null) c[t.dataset.dec].qty = Math.max(1, c[t.dataset.dec].qty - 1);
    else if (t.dataset.rm != null) c.splice(t.dataset.rm, 1);
    else return;
    setCart(c);
    openCart();
  });

  function closeAll() {
    $("ovDetail").classList.remove("on");
    $("ovCart").classList.remove("on");
    $("ovCheckout").classList.remove("on");
    $("ovInfo").classList.remove("on");
  }

  // ===== ສັ່ງຊື້: ແຜນທີ່ປັກໝຸດ + ປະເພດການສົ່ງ + ສ້າງອໍເດີ =====
  const EXPRESS_MAX_KM = 25;
  let coMap = null, coMarker = null, coDrop = null, coType = "express", coShops = {};

  // ຄ່າສົ່ງທັງທຣິບ: ລວມໄລຍະທຸກຮ້ານ ≤7 ກມ = 3,500/ກມ, >7 ກມ = 2,500/ກມ (ອັດຕາດຽວທັງໝົດ)
  function calcTripFee(totalKm) {
    const rate = totalKm <= 7 ? 3500 : 2500;
    return Math.round((totalKm * rate) / 100) * 100;
  }
  // ແບ່ງຄ່າສົ່ງໃຫ້ແຕ່ລະຮ້ານຕາມສັດສ່ວນໄລຍະ (ປັດເປັນ 100 ກີບ, ຮ້ານສຸດທ້າຍເກັບສ່ວນທີ່ເຫຼືອ)
  function feeShares(kmList) {
    const total = kmList.reduce(function (s, k) { return s + k; }, 0);
    const trip = total > 0 ? calcTripFee(total) : 0;
    let used = 0;
    return kmList.map(function (k, i) {
      const share = i === kmList.length - 1 ? trip - used : (total > 0 ? Math.round((trip * k / total) / 100) * 100 : 0);
      used += share;
      return share;
    });
  }
  function cartGroups() {
    const g = {};
    getCart().forEach(function (x) {
      if (!g[x.shopName]) g[x.shopName] = { shopName: x.shopName, items: [], goods: 0 };
      g[x.shopName].items.push(x);
      g[x.shopName].goods += (Number(x.price) || 0) * x.qty;
    });
    return Object.keys(g).map(function (k) { return g[k]; });
  }
  function shopKm(name) {
    const s = coShops[name];
    if (!s || isNaN(s.lat) || isNaN(s.lng) || !coDrop) return null;
    return distKm(s.lat, s.lng, coDrop.lat, coDrop.lng);
  }
  function expressOk(groups) {
    return groups.every(function (g) {
      const k = shopKm(g.shopName);
      return k !== null && k <= EXPRESS_MAX_KM;
    });
  }
  async function loadShopCoords() {
    try {
      const r = await fetch(API, { cache: "no-store" });
      const list = await r.json();
      (Array.isArray(list) ? list : []).forEach(function (s) {
        coShops[s.shopName] = { lat: Number(s.lat), lng: Number(s.lng), prep: Number(s.prepMinutes) || 0 };
      });
    } catch (e) {}
  }

  async function openCheckout() {
    if (!cartGroups().length) return;
    closeAll();
    coDrop = null; coMarker = null; coMap = null; coType = "express"; coShops = {};
    let me = {};
    try { me = JSON.parse(localStorage.getItem("llux_me") || "{}"); } catch (e) {}
    $("sheetCheckout").innerHTML =
      '<h2>ສັ່ງຊື້</h2>' +
      '<label class="lbl">ຊື່ຜູ້ຮັບ</label><input id="coName" class="inp" value="' + esc(me.name || "") + '">' +
      '<label class="lbl">ເບີໂທ</label><input id="coPhone" class="inp" type="tel" value="' + esc(me.phone || "") + '">' +
      '<label class="lbl">ປັກໝຸດຈຸດສົ່ງ (ແຕະແຜນທີ່ ຫຼື ລາກໝຸດ)</label>' +
      '<div id="coMap" class="comap"></div>' +
      '<button class="btn ghost" id="coLoc" type="button">📍 ໃຊ້ຕຳແໜ່ງຂອງຂ້ອຍ</button>' +
      '<label class="lbl">ປະເພດການສົ່ງ</label>' +
      '<div class="dtype">' +
        '<button type="button" class="dt" id="dtExpress"><b>⚡ ສົ່ງດ່ວນທັນທີ</b><span>ຕົວເມືອງ / ໃກ້ຮ້ານ (ບໍ່ເກີນ 25 ກມ) · ນັບເວລາຫຼັງຮັບສິນຄ້າ</span></button>' +
        '<button type="button" class="dt" id="dtShip"><b>🚚 ໄປຕ່າງແຂວງ</b><span>ແຍກ ແລະ ແພັກສິນຄ້າ ແລ້ວສົ່ງຂົນສົ່ງ · ຮັບພາຍໃນ 3 ວັນ</span></button>' +
      '</div>' +
      '<p id="coTypeNote" class="note"></p>' +
      '<div id="coSum"></div>' +
      '<button class="btn" id="coGo" type="button">ຢືນຢັນການສັ່ງຊື້</button>' +
      '<p id="coMsg" class="note"></p>' +
      '<button class="btn ghost" id="coBack" type="button">ກັບໄປຕະກ້າ</button>';
    $("ovCheckout").classList.add("on");

    $("coLoc").onclick = function () {
      if (!navigator.geolocation) { toast("ເບຣາວເຊີນີ້ບໍ່ຮອງຮັບຕຳແໜ່ງ"); return; }
      navigator.geolocation.getCurrentPosition(function (p) {
        coMap.setView([p.coords.latitude, p.coords.longitude], 16);
        setDrop(p.coords.latitude, p.coords.longitude);
      }, function () { toast("ຫາຕຳແໜ່ງບໍ່ໄດ້"); }, { enableHighAccuracy: true, timeout: 10000 });
    };
    $("dtExpress").onclick = function () { if (!$("dtExpress").disabled) { coType = "express"; renderSummary(); } };
    $("dtShip").onclick = function () { coType = "ship"; renderSummary(); };
    $("coGo").onclick = submitOrder;
    $("coBack").onclick = openCart;

    await loadShopCoords();
    coMap = L.map("coMap").setView([17.9757, 102.6331], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(coMap);
    coMap.on("click", function (e) { setDrop(e.latlng.lat, e.latlng.lng); });
    setTimeout(function () { coMap.invalidateSize(); }, 250);
    renderSummary();
  }

  function setDrop(lat, lng) {
    coDrop = { lat: lat, lng: lng };
    if (!coMarker) {
      coMarker = L.marker([lat, lng], { draggable: true }).addTo(coMap);
      coMarker.on("dragend", function () {
        const p = coMarker.getLatLng();
        setDrop(p.lat, p.lng);
      });
    } else {
      coMarker.setLatLng([lat, lng]);
    }
    renderSummary();
  }

  function renderSummary() {
    const groups = cartGroups();
    const can = !!coDrop && expressOk(groups);
    if (!can && coType === "express") coType = "ship";
    $("dtExpress").disabled = !can;
    $("dtExpress").classList.toggle("on", coType === "express");
    $("dtShip").classList.toggle("on", coType === "ship");

    let note = "";
    if (!coDrop) note = "ກະລຸນາປັກໝຸດຈຸດສົ່ງກ່ອນ";
    else if (!expressOk(groups)) note = "ມີຮ້ານຢູ່ໄກເກີນ 25 ກມ ຈາກຈຸດສົ່ງ ສົ່ງດ່ວນບໍ່ໄດ້ ໃຫ້ເລືອກໄປຕ່າງແຂວງ";
    $("coTypeNote").textContent = note;

    if (!coDrop) { $("coSum").innerHTML = ""; return; }
    let goods = 0, fee = 0, html = "";
    const kmList = groups.map(function (g) { const k = shopKm(g.shopName); return k === null ? 0 : k; });
    const shares = coType === "express" ? feeShares(kmList) : groups.map(function () { return 0; });
    groups.forEach(function (g, idx) {
      const km = shopKm(g.shopName);
      const f = shares[idx];
      goods += g.goods;
      fee += f;
      html += '<div class="r"><b>' + esc(g.shopName) + '</b> · ' + money(g.goods) +
        (km !== null ? ' · ~' + (Math.round(km * 10) / 10) + ' ກມ' : '') +
        (coType === "express" ? ' · ຄ່າສົ່ງ ~' + money(f) : '') + '</div>';
    });
    html += '<div class="total"><span>ລວມຄ່າສິນຄ້າ</span><span>' + money(goods) + '</span></div>';
    html += coType === "express"
      ? '<p class="note">ຄ່າສົ່ງປະມານ ' + money(fee) + ' (ຍອດຈິງຄິດຕາມເສັ້ນທາງຈິງຕອນສັ່ງ)</p>'
      : '<p class="note">ໄປຕ່າງແຂວງ: ແຍກ ແລະ ແພັກສິນຄ້າ ແລ້ວສົ່ງຂົນສົ່ງ ຮັບພາຍໃນ 3 ວັນ · ຄ່າຂົນສົ່ງແອດມິນຈະແຈ້ງຍອດໃຫ້ຫຼັງຢືນຢັນ</p>';
    $("coSum").innerHTML = html;
  }

  async function submitOrder() {
    const name = $("coName").value.trim();
    const phone = $("coPhone").value.replace(/\D/g, "");
    if (!name || phone.length < 8) { $("coMsg").textContent = "ໃສ່ຊື່ ແລະ ເບີໂທໃຫ້ຄົບ"; return; }
    if (!coDrop) { $("coMsg").textContent = "ປັກໝຸດຈຸດສົ່ງໃນແຜນທີ່ກ່ອນ"; return; }
    const groups = cartGroups();
    if (!groups.length) { $("coMsg").textContent = "ຕະກ້າວ່າງ"; return; }
    try { localStorage.setItem("llux_me", JSON.stringify({ name: name, phone: phone })); } catch (e) {}

    $("coGo").disabled = true;
    $("coMsg").textContent = "ກຳລັງສັ່ງຊື້...";
    let res = null;
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          type: "order", serviceType: "buy", deliveryType: coType,
          customerName: name, phone: phone, dropLat: coDrop.lat, dropLng: coDrop.lng,
          shops: groups.map(function (g) {
            return { shopName: g.shopName, items: g.items.map(function (x) { return { itemName: x.itemName, qty: x.qty }; }) };
          })
        })
      });
      res = await r.json();
    } catch (e) { res = null; }
    if (!res || !res.ok) {
      $("coGo").disabled = false;
      $("coMsg").textContent = orderErr(res);
      return;
    }
    setCart([]);
    rememberOrder(res.orderId);
    showOrderResult(res);
  }

  // ຈື່ເລກອໍເດີໄວ້ໃນເຄື່ອງນີ້ ເພື່ອເບິ່ງຄືນ/ດຳເນີນຕໍ່ໃນໜ້າ "ອໍເດີຂອງຂ້ອຍ"
  function rememberOrder(id) {
    try {
      const a = JSON.parse(localStorage.getItem("llux_orders") || "[]");
      const b = [id].concat(a.filter(function (x) { return x !== id; })).slice(0, 30);
      localStorage.setItem("llux_orders", JSON.stringify(b));
    } catch (e) {}
  }

  function orderErr(res) {
    const r = res && res.reason;
    if (r === "far") return "ຮ້ານ " + (res.shopName || "") + " ຢູ່ໄກເກີນ 25 ກມ ໃຫ້ເລືອກໄປຕ່າງແຂວງ";
    if (r === "shop") return "ຮ້ານ " + (res.shopName || "") + " ຍັງບໍ່ພ້ອມຮັບອໍເດີ (ຫຼື ເອກະສານບໍ່ຄົບ)";
    if (r === "item") return "ສິນຄ້າ " + (res.itemName || "") + " ໝົດ ຫຼື ບໍ່ມີແລ້ວ ກະລຸນາເອົາອອກຈາກຕະກ້າ";
    return "ສັ່ງຊື້ບໍ່ໄດ້ ລອງໃໝ່ອີກຄັ້ງ";
  }

  function showOrderResult(res) {
    const shopsHtml = (res.shops || []).map(function (s) {
      const q = s.qr || {};
      return '<div class="cgroup"><div class="gh"><span>' + esc(s.shopName) + '</span><span>' + money(s.goodsTotal) + '</span></div>' +
        '<div class="r" style="padding:8px 12px">' + (res.deliveryType === "ship" ? "ຄ່າຂົນສົ່ງ: ແອດມິນຈະແຈ້ງ" : "ຄ່າສົ່ງ: " + money(s.fee) + " · ຍອດໂອນ: " + money((s.goodsTotal || 0) + (s.fee || 0))) + '</div>' +
        (q.qrImageUrl ? '<img src="' + esc(q.qrImageUrl) + '" alt="QR" style="width:200px;max-width:80%;display:block;margin:8px auto;">' : '') +
        (q.accountNo ? '<p class="note" style="text-align:center">' + esc(q.bankName) + ' · ' + esc(q.accountName) + ' · ' + esc(q.accountNo) + '</p>' : '') +
        '</div>';
    }).join("");
    $("sheetCheckout").innerHTML =
      '<h2>ສັ່ງຊື້ສຳເລັດ ✔</h2>' +
      '<p class="note">ເລກອໍເດີ <b>' + esc(res.orderId) + '</b></p>' +
      '<p class="note">1) ລໍຖ້າຮ້ານຢືນຢັນອໍເດີ<br>2) ໂອນຍອດຂອງແຕ່ລະຮ້ານ (ຄ່າສິນຄ້າ + ຄ່າສົ່ງ) ຕາມ QR ດ້ານລຸ່ມ ແລ້ວກົດ "ຂ້ອຍໂອນແລ້ວ" ໃນໜ້າຕິດຕາມ<br>3) ໄຣເດີຈະມາຮັບສິນຄ້າ ແລະ ຮ້ານຈ່າຍຄ່າສົ່ງໃຫ້ໄຣເດີຕອນນັ້ນ</p>' +
      (res.deliveryType === "ship" ? '<p class="note">ໄປຕ່າງແຂວງ: ຮັບຂອງພາຍໃນ 3 ວັນ</p>' : '') +
      shopsHtml +
      '<button class="btn" id="coTrack" type="button" disabled>ລໍຖ້າຮ້ານຮັບອໍເດີ...</button>' +
      '<button class="btn ghost" id="coDone" type="button">ປິດ</button>';
    $("coDone").onclick = closeAll;
    $("coTrack").onclick = function () { location.href = "buyorder.html?id=" + encodeURIComponent(res.orderId); };
    watchAccept(res.orderId);
  }

  // ປົດລັອກປຸ່ມ "ໄປໜ້າຕິດຕາມອໍເດີ" ເມື່ອຮ້ານຮັບ (ຫຼື ປະຕິເສດ) ອໍເດີແລ້ວ
  function watchAccept(oid) {
    const t = setInterval(async function () {
      const b = document.getElementById("coTrack");
      if (!b) { clearInterval(t); return; }
      try {
        const r = await fetch(API + "?type=orderstatus&orderId=" + encodeURIComponent(oid), { cache: "no-store" });
        const rows = await r.json();
        if (Array.isArray(rows) && rows.length && rows.every(function (o) { return o.status !== "shop_pending"; })) {
          b.disabled = false;
          b.textContent = "ໄປໜ້າຕິດຕາມອໍເດີ";
          clearInterval(t);
        }
      } catch (e) {}
    }, 5000);
  }

  // ===== ເຫດການ =====
  $("q").addEventListener("input", render);
  $("cats").addEventListener("click", function (e) {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    cat = b.dataset.cat;
    $("secTitle").scrollIntoView({ behavior: "smooth", block: "start" });
    renderCats();
    render();
  });
  $("grid").addEventListener("click", function (e) {
    const a = e.target.closest("[data-add]");
    if (a) {
      if (a.disabled) return;
      addToCart(shown[Number(a.dataset.add)], 1);
      return;
    }
    const c = e.target.closest("[data-idx]");
    if (c) openDetail(shown[Number(c.dataset.idx)]);
  });
  $("ovDetail").addEventListener("click", function (e) { if (e.target.id === "ovDetail") closeAll(); });
  $("ovCart").addEventListener("click", function (e) { if (e.target.id === "ovCart") closeAll(); });
  $("ovCheckout").addEventListener("click", function (e) { if (e.target.id === "ovCheckout") closeAll(); });
  $("ovInfo").addEventListener("click", function (e) { if (e.target.id === "ovInfo") closeAll(); });
  $("sheetInfo").addEventListener("click", function (e) {
    const p = e.target.closest("[data-pick]");
    if (!p) return;
    cat = p.dataset.pick;
    renderCats();
    render();
    closeAll();
    $("secTitle").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  $("btnChat").onclick = function () { window.open("https://wa.me/" + ADMIN_WA, "_blank"); };
  $("btnCartTop").onclick = openCart;
  $("tCart").onclick = openCart;
  $("tTrack").onclick = openTrack;
  $("tHome").onclick = function () { window.scrollTo({ top: 0, behavior: "smooth" }); setTab("tHome"); };
  $("tCat").onclick = openCategories;
  $("tMe").onclick = openMe;

  function setTab(id) {
    ["tHome", "tCat"].forEach(function (k) { $(k).classList.toggle("on", k === id); });
  }

  // ===== ໜ້າຕ່າງທົ່ວໄປ =====
  function openCategories() {
    const counts = {};
    items.forEach(function (i) { if (i.cat) counts[i.cat] = (counts[i.cat] || 0) + 1; });
    const rows = [
      '<button class="cr' + (cat === ALL ? " on" : "") + '" data-pick="' + esc(ALL) + '"><span>🛍️ ' + esc(ALL) + '</span><small>' + items.length + '</small></button>'
    ].concat(LLUX_CATEGORIES.map(function (x) { const n = x.name;
      return '<button class="cr' + (cat === n ? " on" : "") + '" data-pick="' + esc(n) + '"><span>' + iconFor(n) + ' ' + esc(n) + '</span><small>' + counts[n] + '</small></button>';
    }));
    $("sheetInfo").innerHTML = '<h2>ໝວດໝູ່</h2>' + (items.length ? rows.join("") : '<p class="note">ຍັງບໍ່ມີສິນຄ້າ</p>') +
      '<button class="btn ghost" id="infoClose">ປິດ</button>';
    $("infoClose").onclick = closeAll;
    $("ovInfo").classList.add("on");
  }

  function openTrack() {
    $("sheetInfo").innerHTML = '<h2>ຕິດຕາມອໍເດີ</h2>' +
      '<p class="note">ໃສ່ເລກອໍເດີ ທີ່ຂຶ້ນຕົ້ນດ້ວຍ LX</p>' +
      '<input id="trkId" class="inp" placeholder="ເລກອໍເດີ">' +
      '<button class="btn" id="trkGo">ຕິດຕາມ</button>' +
      '<button class="btn ghost" id="trkClose">ປິດ</button>';
    $("trkGo").onclick = function () {
      const v = $("trkId").value.trim();
      if (!v) { toast("ໃສ່ເລກອໍເດີກ່ອນ"); return; }
      location.href = "track.html?id=" + encodeURIComponent(v);
    };
    $("trkClose").onclick = closeAll;
    $("ovInfo").classList.add("on");
  }

  function getMe() { try { return JSON.parse(localStorage.getItem("llux_me") || "{}"); } catch (e) { return {}; } }
  function openMe() {
    const me = getMe();
    $("sheetInfo").innerHTML = '<h2>ບັນຊີຂອງຂ້ອຍ</h2>' +
      '<p class="note">ຂໍ້ມູນນີ້ຈະໃຊ້ຕອນສັ່ງຊື້ ແລະ ເກັບໄວ້ໃນເຄື່ອງນີ້</p>' +
      '<label class="lbl">ຊື່</label><input id="meName" class="inp" value="' + esc(me.name || "") + '">' +
      '<label class="lbl">ເບີໂທ</label><input id="mePhone" class="inp" type="tel" value="' + esc(me.phone || "") + '">' +
      '<button class="btn" id="meSave">ບັນທຶກ</button>' +
      '<a class="btn ghost" href="myorders.html" style="display:block;text-align:center;text-decoration:none">ອໍເດີຂອງຂ້ອຍ</a>' +
      '<button class="btn ghost" id="meTrack">ຕິດຕາມອໍເດີ</button>' +
      '<button class="btn ghost" id="meChat">ແຊັດກັບ LLUX</button>' +
      '<button class="btn ghost" id="meClose">ປິດ</button>';
    $("meSave").onclick = function () {
      try { localStorage.setItem("llux_me", JSON.stringify({ name: $("meName").value.trim(), phone: $("mePhone").value.trim() })); } catch (e) {}
      toast("ບັນທຶກແລ້ວ");
    };
    $("meTrack").onclick = openTrack;
    $("meChat").onclick = function () { window.open("https://wa.me/" + ADMIN_WA, "_blank"); };
    $("meClose").onclick = closeAll;
    $("ovInfo").classList.add("on");
  }

  updateBadges();
  load();
</script>
</body>
</html>
