<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LLUX ໄຣເດີ">
<title>LLUX ໄຣເດີ</title>
<style>
  /* ໂທນສີ LLUX: ພື້ນຫຼັງເຂຽວອ່ອນ, ຕົວໜັງສືຂາວ, ປຸ່ມ/ເນັ້ນສີແດງ */
  :root { --bg:#e0484c; --card:#3f9e63; --text:#ffffff; --muted:#ffffff; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --btn:#1f8a4c; --line:#2f7f52; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Noto Sans Lao",sans-serif; font-size:19px; font-weight:500; text-shadow:0 0 1px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.35); }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:27px; font-weight:800; margin:8px 0 12px; }
  h2 { font-size:21px; font-weight:700; margin:0 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card.alert { border-color:var(--warn); box-shadow:0 0 0 2px rgba(217,119,6,.25); }
  .muted { color:var(--muted); font-size:18px; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:6px 0; font-size:20px; }
  .tag { display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; background:var(--line); }
  .timer { font-weight:600; color:var(--warn); }
  input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; margin:6px 0 10px; background:var(--card); color:var(--text); }
  button { width:100%; padding:14px; border:0; border-radius:12px; font-size:20px; font-weight:700; background:var(--btn); color:#fff; cursor:pointer; margin-top:8px; }
  button.secondary { background:#2f8a5a; width:auto; padding:8px 12px; margin:0; font-size:16px; }
  button.green { background:#0369a1; }
  button:disabled { opacity:.5; cursor:default; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { margin:0; background:var(--line); color:var(--text); }
  .tabs button.on { background:var(--btn); color:#fff; }
  a { color:#9be7ff; font-size:19px; font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  .small { font-size:19px; }
  .callBtn { display:inline-block; width:auto; margin:8px 8px 0 0; padding:12px 16px; border-radius:12px; background:#0369a1; color:#fff; font-size:18px; font-weight:700; text-decoration:none; text-shadow:none; }
  .phoneBtn { width:auto; margin:0; padding:6px 12px; font-size:18px; background:#0369a1; }
  .hidden { display:none !important; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LLUX ໄຣເດີ</h1>

  <!-- ໜ້າເຂົ້າສູ່ລະບົບ -->
  <div id="loginView" class="card">
    <h2>ເຂົ້າສູ່ລະບົບໄຣເດີ</h2>
    <label class="muted">ຊື່ໄຣເດີ</label>
    <input id="riderName" autocomplete="username" placeholder="ປ້ອນຊື່ໄຣເດີ">
    <label class="muted">ລະຫັດ PIN</label>
    <input id="riderPin" type="password" inputmode="numeric" placeholder="ປ້ອນ PIN">
    <button id="btnLogin">ເຂົ້າສູ່ລະບົບ</button>
    <p id="loginMsg" class="muted"></p>
  </div>

  <!-- ໜ້າຫຼັກຂອງໄຣເດີ -->
  <div id="riderView" class="hidden">
    <div class="card">
      <div class="topbar">
        <div>
          <div class="muted">ໄຣເດີ</div>
          <h2 id="riderTitle">-</h2>
        </div>
        <button id="btnLogout" class="secondary">ອອກ</button>
      </div>
    </div>

    <div class="card">
      <div class="tabs" style="margin:0 0 8px;">
        <button id="btnNotify" class="secondary" style="width:auto;">ເປີດການແຈ້ງເຕືອນ</button>
        <button id="btnMute" class="secondary" style="width:auto;">ປິດສຽງ</button>
        <button id="btnLoc" class="secondary" style="width:auto;">ອັບເດດຕຳແໜ່ງ</button>
      </div>
      <p id="notifyState" class="muted"></p>
      <p id="locState" class="muted"></p>
    </div>

    <div class="tabs">
      <button id="tabAvail" class="on">ງານລໍຖ້າ</button>
      <button id="tabMine">ງານຂອງຂ້ອຍ</button>
    </div>

    <p id="emptyMsg" class="muted hidden">ຍັງບໍ່ມີງານ</p>
    <div id="jobs"></div>
    <p id="netMsg" class="muted"></p>
  </div>
</div>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  // ທີ່ຢູ່ API (Apps Script) ເດີ່ວກັບໜ້າຮ້ານ
  const API = "https://script.google.com/macros/s/AKfycbySjDcvpFS8AD4NkOGlv06LQfTWQ9WBCxh72XM8d-TNI4yRsyaIkMz_lg78DN0ccqSaBQ/exec";
  const POLL_MS = 8000;

  const $ = (id) => document.getElementById(id);
  let session = null;   // { riderName, pin }
  let tab = "avail";    // avail | mine
  let jobs = [];
  let pollTimer = null;
  let tickTimer = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function money(n) { return Number(n || 0).toLocaleString("en-US") + " ກີບ"; }

  // ບັນທຶກ session ໄວ້ໃນເບຣາວເຊີ (ຖ້າບໍ່ໄດ້ກໍ່ໃຊ້ໄດ້ປົກກະຕິ)
  function saveSession() { try { localStorage.setItem("llux_rider", JSON.stringify(session)); } catch (e) {} }
  function loadSession() { try { return JSON.parse(localStorage.getItem("llux_rider") || "null"); } catch (e) { return null; } }
  function clearSession() { try { localStorage.removeItem("llux_rider"); } catch (e) {} }

  async function getJson(url) {
    const r = await fetch(url, { cache: "no-store" });
    return r.json();
  }
  // ໃຊ້ text/plain ເພື່ອຫຼີກ preflight
  async function post(body) {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    });
    return r.json();
  }

  function authParams() {
    return "rider=" + encodeURIComponent(session.riderName) + "&pin=" + encodeURIComponent(session.pin);
  }

  async function login() {
    const name = $("riderName").value.trim();
    const pin = $("riderPin").value.trim();
    if (!name || !pin) { $("loginMsg").textContent = "ກະລຸນາປ້ອນຊື່ ແລະ PIN"; return; }
    session = { riderName: name, pin: pin };
    const data = await getJson(API + "?type=myorders&" + authParams()).catch(() => null);
    if (!data || data.error) {
      session = null;
      $("loginMsg").textContent = data && data.error === "auth" ? "ຊື່ ຫຼື PIN ບໍ່ຖືກຕ້ອງ ຫຼືຍັງບໍ່ໄດ້ອະນຸມັດ" : "ເຊື່ອມຕໍ່ບໍ່ໄດ້";
      return;
    }
    saveSession();
    $("loginMsg").textContent = "";
    enterApp();
  }

  function enterApp() {
    $("loginView").classList.add("hidden");
    $("riderView").classList.remove("hidden");
    $("riderTitle").textContent = session.riderName;
    if (window.riderOneSignal) tagRider(window.riderOneSignal);
    refresh();
    clearInterval(pollTimer);
    pollTimer = setInterval(refresh, POLL_MS);
    clearInterval(tickTimer);
    tickTimer = setInterval(render, 1000); // ອັບເດດນັບຖອຍຫຼັງ
    updateLocation();
    clearInterval(locTimer);
    locTimer = setInterval(updateLocation, 12 * 1000); // ສົ່ງຕຳແໜ່ງທຸກ 12 ວິນາທີ
  }

  function logout() {
    session = null; jobs = [];
    stopAlarm();
    clearInterval(pollTimer); clearInterval(tickTimer); clearInterval(locTimer);
    clearSession();
    $("riderView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    $("riderPin").value = "";
  }

  // ===== ຕຳແໜ່ງຂອງໄຣເດີ (ໃຊ້ຈັດລຽງງານໃກ້ສຸດ, ບໍ່ສົ່ງໃຫ້ໄຣເດີຄົນອື່ນ) =====
  let myPos = null, locTimer = null;
  function updateLocation() {
    if (!navigator.geolocation) { $("locState").textContent = "ເບຣາວເຊີນີ້ບໍ່ຮອງຮັບຕຳແໜ່ງ"; return; }
    $("locState").textContent = "ກຳລັງຫາຕຳແໜ່ງ...";
    navigator.geolocation.getCurrentPosition(function (p) {
      myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
      // ສົ່ງຕຳແໜ່ງຂຶ້ນເຊີບເວີ ໃຫ້ລູກຄ້າທີ່ມີງານກັບໄຣເດີເຫັນແບບເຣຍລໄທມ໌
      if (session) post({ type: "loc", riderName: session.riderName, pin: session.pin, lat: myPos.lat, lng: myPos.lng }).catch(function () {});
      const t = new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
      $("locState").textContent = "ອັບເດດຕຳແໜ່ງແລ້ວ ເວລາ " + t;
      refresh();
    }, function () {
      $("locState").textContent = "ບໍ່ສາມາດເຂົ້າຖຶງຕຳແໜ່ງໄດ້ ກະລຸນາອະນຸຍາດການເຂົ້າຖຶງຕຳແໜ່ງ";
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }
  $("btnLoc").onclick = updateLocation;

  async function refresh() {
    if (!session) return;
    try {
      const type = tab === "avail" ? "orders" : "myorders";
      let url = API + "?type=" + type + "&" + authParams();
      if (myPos) url += "&lat=" + myPos.lat + "&lng=" + myPos.lng;
      const data = await getJson(url);
      if (data && data.error === "auth") { logout(); return; }
      jobs = Array.isArray(data) ? data : [];
      $("netMsg").textContent = "";
      render();
    } catch (e) {
      $("netMsg").textContent = "ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກຳລັງລອງໃໝ່...";
    }
  }

  // ນັບຖອຍຫຼັງ 5 ນາທີນັບແຕ່ຕອນໄຣເດີຮັບງານ
  function remainText(iso) {
    if (!iso) return "";
    const end = new Date(iso).getTime() + 5 * 60 * 1000;
    const left = Math.max(0, Math.floor((end - Date.now()) / 1000));
    const m = Math.floor(left / 60), s = String(left % 60).padStart(2, "0");
    return m + ":" + s;
  }

  function actionButtons(o) {
    if (tab === "avail") {
      return '<button data-act="accept" data-row="' + o.row + '">ຮັບງານ</button>';
    }
    // ງານບໍລິການໄຣເດີ (ບໍ່ມີຮ້ານແພັກ) ກົດຮັບສິນຄ້າໄດ້ທັນທີຫຼັງຮັບງານ
    const canPickup = o.status === "ready" || (o.status === "accepted" && o.serviceType !== "buy");
    // ລູກຄ້າແຈ້ງໂອນແລ້ວ ໄຣເດີຕ້ອງກົດຢືນຢັນວ່າໄດ້ຮັບເງິນ
    if (o.serviceType !== "buy" && o.paymentStatus === "claimed" && o.status !== "delivered") {
      return '<p class="muted">ລູກຄ້າແຈ້ງໂອນແລ້ວ ກະລຸນາກວດເງິນ</p>' +
        '<button class="green" data-act="paid" data-row="' + o.row + '">ໄດ້ຮັບເງິນແລ້ວ</button>' +
        (canPickup ? '<button class="green" data-act="picked_up" data-row="' + o.row + '">ຮັບສິນຄ້າຈາກຮ້ານແລ້ວ</button>' : '');
    }
    if (canPickup) {
      return '<button class="green" data-act="picked_up" data-row="' + o.row + '">ຮັບສິນຄ້າຈາກຮ້ານແລ້ວ</button>';
    }
    if (o.status === "picked_up") {
      return '<button class="green" data-act="delivered" data-row="' + o.row + '">ສົ່ງສຳເລັດແລ້ວ</button>';
    }
    return '<p class="muted">ລໍຖ້າຮ້ານແພັກສິນຄ້າ</p>';
  }

  // ===== ສຽງເຕືອນ: ດັງວນເມື່ອມີງານລໍຖ້າ (ໜ້າເປີດຢູ່) =====
  let muted = false, audioCtx = null, beepTimer = null;
  function ensureAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function beepOnce() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 880; gain.gain.value = 0.3;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
  function startAlarm() {
    if (muted || beepTimer) return;
    ensureAudio(); beepOnce();
    beepTimer = setInterval(beepOnce, 900);
  }
  function stopAlarm() { clearInterval(beepTimer); beepTimer = null; }
  function updateAlarm() {
    const hasAvail = tab === "avail" && jobs.length > 0;
    if (hasAvail) startAlarm(); else stopAlarm();
  }
  $("btnMute").onclick = function () {
    muted = !muted;
    $("btnMute").textContent = muted ? "ເປີດສຽງ" : "ປິດສຽງ";
    if (muted) stopAlarm(); else updateAlarm();
  };

  // ===== ແຈ້ງເຕືອນ OneSignal (ເວລາປິດໜ້າ/ຈໍລັອກ) =====
  const APP_ID = "ab31f26a-4291-45f3-838c-1ae71dfa2fb0";
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    try {
      await OneSignal.init({ appId: APP_ID, allowLocalhostAsSecureOrigin: true });
      $("notifyState").textContent = OneSignal.Notifications.permission ? "ການແຈ້ງເຕືອນເປີດແລ້ວ" : "ຍັງບໍ່ໄດ້ເປີດການແຈ້ງເຕືອນ";
      $("btnNotify").onclick = async function () {
        await OneSignal.Notifications.requestPermission();
        if (session) tagRider(OneSignal);
        $("notifyState").textContent = OneSignal.Notifications.permission ? "ການແຈ້ງເຕືອນເປີດແລ້ວ" : "ຍັງບໍ່ໄດ້ເປີດການແຈ້ງເຕືອນ";
      };
      window.riderOneSignal = OneSignal;
      if (session) tagRider(OneSignal);
    } catch (e) {
      $("notifyState").textContent = "ລະບົບແຈ້ງເຕືອນຜິດພາດ";
    }
  });
  // ຕິດ tag ໃຫ້ອຸປະກອນນີ້ເປັນໄຣເດີ ເພື່ອຮັບແຈ້ງເຕືອນງານໃໝ່
  function tagRider(OneSignal) {
    OneSignal.User.addTags({ role: "rider", rider: session.riderName });
  }

  // ເປີດ/ປິດ ທາງເລືອກໂທ (ຈື່ສະຖານະໄວ້ ເພາະ render ເຮັດທຸກ 1 ວິນາທີ)
  let openCall = {};
  // ລິ້ງໂທສາຍກົງ (tel:)
  function telHref(p) { return "tel:" + String(p || "").replace(/[^\d+]/g, ""); }
  // ລິ້ງ WhatsApp: ປ່ຽນເບີລາວ 0xx... ເປັນ 856xx...
  function waHref(p) {
    let d = String(p || "").replace(/\D/g, "");
    if (d.charAt(0) === "0") d = d.slice(1);
    if (d.indexOf("856") !== 0) d = "856" + d;
    return "https://wa.me/" + d;
  }

  function render() {
    const box = $("jobs");
    $("emptyMsg").classList.toggle("hidden", jobs.length > 0);
    updateAlarm();
    box.innerHTML = jobs.map(function (o) {
      const isBuy = o.serviceType === "buy";
      const timer = (tab === "mine" && o.status === "accepted" && isBuy)
        ? '<div class="row"><span class="muted">ຮ້ານຕ້ອງແພັກໃນ</span><span class="timer">' + esc(remainText(o.riderAcceptedAt)) + '</span></div>'
        : "";
      const stateTxt = o.status === "accepted" ? (isBuy ? "ຮ້ານກຳລັງແພັກ" : "ກຳລັງໄປຮັບສິນຄ້າ") : (o.status === "ready" ? "ແພັກແລ້ວ ພ້ອມຮັບ" : (o.status === "picked_up" ? "ກຳລັງສົ່ງ" : ""));
      const pick = (o.pickLat && o.pickLng) ? 'https://maps.google.com/?q=' + o.pickLat + ',' + o.pickLng : "";
      const drop = (o.dropLat && o.dropLng) ? 'https://maps.google.com/?q=' + o.dropLat + ',' + o.dropLng : "";
      return '<div class="card' + (tab === "avail" ? " alert" : "") + '">' +
        '<div class="row"><span class="muted">ເລກອໍເດີ</span><span>' + esc(o.orderId) + '</span></div>' +
        (tab === "avail" && o.fromMeKm != null ? '<div class="row"><span class="muted">ຫ່າງຈາກທ່ານ</span><span class="ok">' + esc(o.fromMeKm) + ' ກມ</span></div>' : '') +
        '<div class="row"><span class="muted">ຮ້ານ</span><span>' + esc(o.shopName) + '</span></div>' +
        (isBuy ? '<div class="row"><span class="muted">ສິນຄ້າ</span><span>' + esc(o.itemDesc) + '</span></div>' : '') +
        '<div class="row"><span class="muted">ຄ່າສົ່ງ</span><span>' + money(o.fee) + '</span></div>' +
        (isBuy ? '<div class="row"><span class="muted">ມູນຄ່າສິນຄ້າ</span><span>' + money(o.goodsTotal) + '</span></div>' : '') +
        '<div class="row"><span class="muted">ລູກຄ້າ</span><span>' + esc(o.customerName) + '</span></div>' +
        '<div class="row"><span class="muted">ເບີໂທ</span><button class="phoneBtn" data-phone-toggle="' + esc(o.row) + '">' + esc(o.phone) + '</button></div>' +
        '<div class="callOpts' + (openCall[o.row] ? '' : ' hidden') + '">' +
          '<a class="callBtn" href="' + esc(telHref(o.phone)) + '">ໂທສາຍກົງ</a>' +
          '<a class="callBtn" href="' + esc(waHref(o.phone)) + '" target="_blank">WhatsApp</a>' +
        '</div>' +
        (pick ? '<p class="small"><a href="' + pick + '" target="_blank">ເປີດແຜນທີ່ຮັບສິນຄ້າ</a></p>' : '') +
        (drop ? '<p class="small"><a href="' + drop + '" target="_blank">ເປີດແຜນທີ່ສົ່ງສິນຄ້າ</a></p>' : '') +
        (stateTxt ? '<p class="muted">' + stateTxt + '</p>' : '') +
        timer +
        actionButtons(o) +
        '</div>';
    }).join("");
  }

  async function doAction(act, row) {
    try {
      let res;
      if (act === "accept") {
        res = await post({ type: "accept", riderName: session.riderName, pin: session.pin, row: row });
        if (!res.ok) { alert(res.reason === "taken" ? "ງານນີ້ມີຄົນຮັບແລ້ວ" : "ຮັບງານບໍ່ໄດ້"); }
      } else if (act === "paid") {
        res = await post({ type: "payconfirm", riderName: session.riderName, pin: session.pin, row: row });
        if (!res.ok) { alert("ຢືນຢັນການຮັບເງິນບໍ່ໄດ້ ລອງໃໝ່"); }
      } else {
        const newStatus = act;
        res = await post({ type: "status", riderName: session.riderName, pin: session.pin, row: row, newStatus: newStatus });
        if (!res.ok) { alert("ອັບເດດສະຖານະບໍ່ໄດ້ ລອງໃໝ່"); }
      }
    } catch (e) {
      alert("ເຊື່ອມຕໍ່ບໍ່ໄດ້ ລອງໃໝ່");
    }
    refresh();
  }

  function setTab(t) {
    tab = t;
    $("tabAvail").classList.toggle("on", t === "avail");
    $("tabMine").classList.toggle("on", t === "mine");
    jobs = [];
    render();
    refresh();
  }

  // ກົດເບີໂທລູກຄ້າ = ສະແດງ/ປິດ ທາງເລືອກໂທ
  $("jobs").addEventListener("click", function (ev) {
    const t = ev.target.closest("[data-phone-toggle]");
    if (!t) return;
    const key = t.dataset.phoneToggle;
    openCall[key] = !openCall[key];
    render();
  });

  $("btnLogin").onclick = login;
  $("btnLogout").onclick = logout;
  $("tabAvail").onclick = function () { setTab("avail"); };
  $("tabMine").onclick = function () { setTab("mine"); };
  $("jobs").addEventListener("click", function (ev) {
    const b = ev.target.closest("button[data-act]");
    if (!b || b.disabled) return;
    b.disabled = true;
    doAction(b.dataset.act, Number(b.dataset.row)).finally(function () { b.disabled = false; });
  });

  // ເລີ່ມຕົ້ນ: ຈື່ການເຂົ້າລະບົບເດີມ
  const saved = loadSession();
  if (saved && saved.riderName && saved.pin) {
    session = saved;
    enterApp();
  }
</script>
</body>
</html>
