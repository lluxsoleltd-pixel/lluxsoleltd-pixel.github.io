<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຕິດຕາມອໍເດີ · LLUX</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --red:#d62828; --red2:#ff5a36; --ink:#1d2330; --mute:#6b7280; --line:#e5e7eb; --bg:#f5f5f6; --ok:#16a34a; }
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: var(--bg); margin: 0; color: var(--ink); padding-bottom: 40px; }
  .top { background: linear-gradient(180deg, var(--red), var(--red2)); color: #fff; padding: 14px 16px; }
  .top a { color: #fff; text-decoration: none; font-size: 14px; }
  .top h1 { font-size: 17px; margin: 6px 0 0; word-break: break-all; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .card h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .st { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #fee2e2; color: var(--red); white-space: nowrap; }
  .st.ok { background: #dcfce7; color: var(--ok); }
  .st.wait { background: #fef3c7; color: #92400e; }
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .step { font-size: 11px; padding: 3px 7px; border-radius: 999px; background: #eef1f5; color: var(--mute); }
  .step.done { background: #dcfce7; color: var(--ok); font-weight: 700; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 14px; }
  .muted { color: var(--mute); font-size: 13px; }
  .qr { width: 200px; max-width: 80%; display: block; margin: 10px auto; border-radius: 10px; }
  .btn { display: block; width: 100%; text-align: center; padding: 13px; border: 0; border-radius: 12px; font-size: 15px; background: var(--red); color: #fff; text-decoration: none; cursor: pointer; margin-top: 8px; }
  .btn.ghost { background: #eef1f5; color: var(--ink); }
  .btn:disabled { background: #d1d5db; cursor: default; }
  .btn.danger { background: #b42318; }
  .hidden { display: none !important; }
  .msg { color: var(--mute); text-align: center; font-size: 13px; }
  #map { height: 280px; border-radius: 14px; margin-bottom: 12px; }
  .rv { position: relative; width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .rv .ring { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .rv .ring i { position: absolute; top: -9px; left: 50%; margin-left: -6px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid #d62828; }
  .cd { font-variant-numeric: tabular-nums; color: var(--red); }
</style>
</head>
<body>
<div class="top">
  <a href="products.html">‹ ກັບໄປໜ້າສິນຄ້າ</a>
  <a href="myorders.html" style="margin-left:14px">ອໍເດີຂອງຂ້ອຍ</a>
  <h1 id="oid">ກຳລັງໂຫຼດ...</h1>
</div>
<div class="wrap">
  <div class="card" id="sumCard"></div>
  <div id="cancelBox"></div>
  <div class="card hidden" id="trackCard"></div>
  <div id="map" class="hidden"></div>
  <div id="shops"></div>
  <p class="msg" id="msg"></p>
</div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbySjDcvpFS8AD4NkOGlv06LQfTWQ9WBCxh72XM8d-TNI4yRsyaIkMz_lg78DN0ccqSaBQ/exec";
  const ID = new URLSearchParams(location.search).get("id") || "";
  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function money(n) { return Number(n || 0).toLocaleString("en-US") + " ກີບ"; }
  function setMsg(t) { $("msg").textContent = t || ""; }

  const STEPS = ["ຮ້ານຢືນຢັນ", "ຊຳລະເງິນ", "ແພັກສິນຄ້າ", "ໄຣເດີຮັບງານ", "ກຳລັງສົ່ງ", "ສົ່ງສຳເລັດ"];
  const DONE = { shop_pending: 0, awaiting_payment: 1, open_for_rider: 2, ready: 3, accepted: 4, picked_up: 5, delivered: 6 };
  const LABEL = {
    shop_pending: ["ລໍຖ້າຮ້ານຢືນຢັນອໍເດີ", "wait"],
    shop_rejected: ["ຮ້ານປະຕິເສດອໍເດີ", ""],
    awaiting_payment: ["ລໍຖ້າໂອນຄ່າສິນຄ້າ", "wait"],
    open_for_rider: ["ຊຳລະແລ້ວ · ກຳລັງແພັກ / ລໍຖ້າໄຣເດີ", "wait"],
    ready: ["ແພັກສິນຄ້າແລ້ວ · ລໍຖ້າໄຣເດີ", "wait"],
    accepted: ["ໄຣເດີຮັບງານແລ້ວ", "ok"],
    picked_up: ["ກຳລັງຈັດສົ່ງ", "ok"],
    delivered: ["ສົ່ງສຳເລັດ ✔", "ok"],
    cancelled_by_customer: ["ທ່ານຍົກເລີກອໍເດີແລ້ວ", ""]
  };
  const CANCELABLE = ["shop_pending", "awaiting_payment", "pending"];
  let lastKey = "";  // ຈື່ຂໍ້ມູນຄັ້ງກ່ອນ ເພື່ອບໍ່ໃຫ້ໜ້າຈໍກະພິບ/ປຸ່ມທີ່ເປີດຢູ່ປິດເອງ

  // ແປງເບີໄຣເດີເປັນລິ້ງ WhatsApp (0xx → 856xx)
  function waLink(p) {
    let d = String(p || "").replace(/\D/g, "");
    if (d.indexOf("0") === 0) d = "856" + d.slice(1);
    return "https://wa.me/" + d;
  }

  // ຈື່ເລກອໍເດີໄວ້ໃນເຄື່ອງນີ້ ເພື່ອໃຫ້ເບິ່ງໄດ້ໃນໜ້າ "ອໍເດີຂອງຂ້ອຍ"
  function rememberOrder(id) {
    try {
      const a = JSON.parse(localStorage.getItem("llux_orders") || "[]");
      const b = [id].concat(a.filter(function (x) { return x !== id; })).slice(0, 30);
      localStorage.setItem("llux_orders", JSON.stringify(b));
    } catch (e) {}
  }
  function statusOf(o) {
    if (o.status === "accepted" && o.headingAt) return ["ໄຣເດີກຳລັງໄປຮັບສິນຄ້າ", "ok"];
    if (o.status === "awaiting_payment" && o.paymentStatus === "claimed") return ["ແຈ້ງໂອນແລ້ວ · ລໍຖ້າຮ້ານກວດຍອດ", "wait"];
    if (o.status === "awaiting_payment" && o.paymentStatus === "slip_uploaded") return ["ອັບສລິບແລ້ວ · ລໍຖ້າຮ້ານກວດຍອດ", "wait"];
    return LABEL[o.status] || [o.status || "-", ""];
  }

  function summary(list) {
    const dt = list[0].deliveryType || "express";
    const goods = list.reduce(function (s, o) { return s + (Number(o.goodsTotal) || 0); }, 0);
    const fee = list.reduce(function (s, o) { return s + (Number(o.fee) || 0); }, 0);
    $("sumCard").innerHTML =
      '<div class="row"><span class="muted">ການສົ່ງ</span><span>' + (dt === "ship" ? "🚚 ໄປຕ່າງແຂວງ (ຮັບພາຍໃນ 3 ວັນ)" : "⚡ ສົ່ງດ່ວນທັນທີ") + '</span></div>' +
      '<div class="row"><span class="muted">ລວມຄ່າສິນຄ້າ</span><span>' + money(goods) + '</span></div>' +
      (dt === "ship"
        ? '<div class="row"><span class="muted">ຄ່າຂົນສົ່ງ</span><span>ຈ່າຍໃຫ້ບໍລິສັດຂົນສົ່ງໂດຍກົງ</span></div>'
        : '<div class="row"><span class="muted">ຄ່າສົ່ງ (ລວມ)</span><span>' + money(fee) + '</span></div>');
  }

  function shopCard(o) {
    const st = statusOf(o);
    const done = DONE[o.status] || 0;
    let h = '<div class="card"><h2><span>' + esc(o.shopName) + '</span><span class="st ' + st[1] + '">' + esc(st[0]) + '</span></h2>';
    h += '<div class="steps">' + STEPS.map(function (s, i) { return '<span class="step' + (i < done ? ' done' : '') + '">' + s + '</span>'; }).join("") + '</div>';
    h += '<div class="row"><span class="muted">ຄ່າສິນຄ້າ</span><span>' + money(o.goodsTotal) + '</span></div>';
    if (o.itemDesc) h += '<div class="row"><span class="muted">ລາຍການ</span><span style="text-align:right">' + esc(o.itemDesc) + '</span></div>';

    // ຄ່າສິນຄ້າ: ໂອນໃຫ້ຮ້ານ
    if (o.status === "awaiting_payment" && o.paymentStatus === "unpaid") {
      const total = (Number(o.goodsTotal) || 0) + (o.deliveryType === "ship" ? 0 : (Number(o.fee) || 0));
      h += '<p class="muted" style="margin-top:10px">ໂອນຍອດ <b>' + money(total) + '</b> ເຂົ້າບັນຊີຮ້ານ (ຄ່າສິນຄ້າ + ຄ່າສົ່ງ) ແລ້ວກົດ "ຂ້ອຍໂອນແລ້ວ"</p>';
      if (o.shopQr && o.shopQr.qrImageUrl) h += '<img class="qr" src="' + esc(o.shopQr.qrImageUrl) + '" alt="QR ຮ້ານ">';
      if (o.shopQr && o.shopQr.accountNo) h += '<p class="muted" style="text-align:center">' + esc(o.shopQr.bankName) + ' · ' + esc(o.shopQr.accountName) + ' · ' + esc(o.shopQr.accountNo) + '</p>';
      h += '<button class="btn" data-claim="' + o.row + '">ຂ້ອຍໂອນແລ້ວ</button>';
      h += '<label class="btn ghost" style="cursor:pointer">📎 ອັບສລິບ (ບໍ່ບັງຄັບ)<input type="file" accept="image/*" class="hidden" data-slip="' + o.row + '"></label>';
    }

    // ໄຣເດີ
    if (o.rider) {
      h += '<div class="row"><span class="muted">ໄຣເດີ</span><span>' + esc(o.rider.riderName) + (o.rider.plate ? ' · ' + esc(o.rider.plate) : '') + '</span></div>';
      if (o.rider.phone) {
        h += '<button class="btn ghost" data-callopen="1">📞 ໂທຫາໄຣເດີ</button>' +
             '<div class="callopts hidden">' +
             '<a class="btn" href="tel:' + esc(o.rider.phone) + '">📞 ໂທສາຍກົງ</a>' +
             '<a class="btn ghost" href="' + esc(waLink(o.rider.phone)) + '" target="_blank" rel="noopener">💬 WhatsApp</a>' +
             '</div>';
      }
    }

    // ຄ່າສົ່ງ: ລວມຢູ່ໃນຍອດໂອນໃຫ້ຮ້ານແລ້ວ ຮ້ານຈະຈ່າຍໃຫ້ໄຣເດີຕອນມາຮັບສິນຄ້າ
    if (o.serviceType === "buy" && o.deliveryType !== "ship" && Number(o.fee) > 0 && o.feePaymentStatus !== "confirmed") {
      h += '<p class="muted" style="text-align:center">ຄ່າສົ່ງ ' + money(o.fee) + ' ຮ້ານຈະຈ່າຍໃຫ້ໄຣເດີຕອນມາຮັບສິນຄ້າ</p>';
    }
    if (o.feePaymentStatus === "confirmed" && Number(o.fee) > 0) h += '<p class="muted" style="text-align:center">ຄ່າສົ່ງຊຳລະໃຫ້ໄຣເດີແລ້ວ ✔</p>';
    if (o.rider && !o.rider.lat && o.feePaymentStatus !== "confirmed" && o.deliveryType !== "ship") {
      h += '<p class="muted">ຕຳແໜ່ງໄຣເດີຈະສະແດງຫຼັງຊຳລະຄ່າສົ່ງຢືນຢັນແລ້ວ</p>';
    }
    if (o.deliveryType === "ship") h += '<p class="muted">ຄ່າຂົນສົ່ງຕ່າງແຂວງ: ຈ່າຍໃຫ້ບໍລິສັດຂົນສົ່ງໂດຍກົງ (ຕາມເງື່ອນໄຂຕົ້ນທາງ/ປາຍທາງທີ່ເລືອກ)</p>';

    // ຫຼັກຖານການສົ່ງ: ຮູບທີ່ໄຣເດີຖ່າຍຈຸດສົ່ງ
    if (o.deliveryPhotoUrl) {
      h += '<div class="row" style="margin-top:10px"><span class="muted">ຫຼັກຖານການສົ່ງ</span><span class="ok">ສົ່ງສຳເລັດແລ້ວ ✔</span></div>';
      h += '<a href="' + esc(o.deliveryPhotoUrl) + '" target="_blank" rel="noopener"><img src="' + esc(o.deliveryPhotoUrl) + '" alt="ຮູບຈຸດສົ່ງ" style="width:100%;border-radius:12px;margin-top:6px;display:block;"></a>';
    }

    return h + '</div>';
  }

  // ແຜນທີ່: ຈຸດສົ່ງ, ຮ້ານ ແລະ ໄຣເດີ (ເມື່ອມີຕຳແໜ່ງ)
  let map = null, baseLayer = null, trackLayer = null, fitted = false;
  function drawMap(list) {
    const drop = list.find(function (o) { return isFinite(o.dropLat) && isFinite(o.dropLng) && o.dropLat !== 0; });
    if (!drop) return;
    $("map").classList.remove("hidden");
    if (!map) {
      map = L.map("map").setView([drop.dropLat, drop.dropLng], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
      baseLayer = L.layerGroup().addTo(map);
      trackLayer = L.layerGroup().addTo(map);
    }
    baseLayer.clearLayers();
    const pts = [[drop.dropLat, drop.dropLng]];
    L.marker([drop.dropLat, drop.dropLng]).bindTooltip("ຈຸດສົ່ງ").addTo(baseLayer);
    list.forEach(function (o) {
      if (isFinite(o.pickLat) && isFinite(o.pickLng) && o.pickLat !== 0) {
        pts.push([o.pickLat, o.pickLng]);
        L.circleMarker([o.pickLat, o.pickLng], { radius: 7, color: "#d62828" }).bindTooltip(o.shopName).addTo(baseLayer);
      }
    });
    // ຈັດແຜນທີ່ຄັ້ງທຳອິດເທົ່ານັ້ນ ບໍ່ໃຫ້ຊູມກັບຄືນທຸກຄັ້ງທີ່ໂຫຼດໃໝ່
    if (!fitted && pts.length > 1) { map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 }); fitted = true; }
  }

  // ===== ຕິດຕາມໄຣເດີແບບສົດ: ໄອຄອນທິດທາງ, ເສັ້ນທາງ, ເວລາ/ໄລຍະ ນັບຖອຍຫຼັງ =====
  const SPEED_KMH = 30; // ໃຫ້ກົງກັບ RIDER_KMH ໃນ Code.gs
  let riderMarker = null, lastRiderPos = null, riderHeading = 0, trackPlan = null, trackFitted = false;

  function distKm(a, b) {
    const R = 6371, t = function (x) { return x * Math.PI / 180; };
    const dLat = t(b[0] - a[0]), dLng = t(b[1] - a[1]);
    const h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(t(a[0])) * Math.cos(t(b[0])) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function bearing(a, b) {
    const t = function (x) { return x * Math.PI / 180; };
    const dLng = t(b[1] - a[1]);
    const y = Math.sin(dLng) * Math.cos(t(b[0]));
    const x = Math.cos(t(a[0])) * Math.sin(t(b[0])) - Math.sin(t(a[0])) * Math.cos(t(b[0])) * Math.cos(dLng);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  // ເສັ້ນທາງຕາມຖນນ (OSRM) ສຳຮອງດ້ວຍເສັ້ນຊື່ຖ້າດຶງບໍ່ໄດ້
  async function route(a, b) {
    try {
      const url = "https://router.project-osrm.org/route/v1/driving/" + a[1] + "," + a[0] + ";" + b[1] + "," + b[0] + "?overview=full&geometries=geojson";
      const r = await fetch(url, { cache: "no-store" });
      const j = await r.json();
      if (j.routes && j.routes[0]) {
        return { km: j.routes[0].distance / 1000, coords: j.routes[0].geometry.coordinates.map(function (c) { return [c[1], c[0]]; }) };
      }
    } catch (e) {}
    return { km: distKm(a, b) * 1.3, coords: [a, b] };
  }
  function fmtMmSs(s) {
    s = Math.round(s);
    const m = Math.floor(s / 60), r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  function hideTrack() {
    trackPlan = null;
    riderMarker = null;
    if (trackLayer) trackLayer.clearLayers();
    $("trackCard").classList.add("hidden");
    $("trackCard").innerHTML = "";
  }

  async function updateTrack(list) {
    const withRider = list.find(function (o) { return o.rider && o.rider.lat != null && o.rider.lng != null; });
    const active = list.some(function (o) { return ["accepted", "ready", "picked_up"].indexOf(o.status) >= 0; });
    const drop = list.find(function (o) { return isFinite(o.dropLat) && isFinite(o.dropLng) && o.dropLat !== 0; });
    if (!withRider || !active || !drop || !map) { hideTrack(); return; }

    const rp = [Number(withRider.rider.lat), Number(withRider.rider.lng)];
    const dp = [drop.dropLat, drop.dropLng];
    // ທິດທາງ: ຄິດຈາກການຍ້າຍຕຳແໜ່ງ (ຖ້າຍ້າຍ 8 ມ. ຂຶ້ນໄປ)
    if (lastRiderPos && distKm(lastRiderPos, rp) * 1000 >= 8) riderHeading = bearing(lastRiderPos, rp);
    lastRiderPos = rp;

    // ຮ້ານທີ່ຍັງຕ້ອງໄປຮັບ (ຍັງບໍ່ picked_up) ເລືອກຮ້ານທີ່ໃກ້ທີ່ສຸດ
    const pend = list.filter(function (o) {
      return (o.status === "accepted" || o.status === "ready") && isFinite(o.pickLat) && o.pickLat !== 0;
    });
    pend.sort(function (a, b) { return distKm(rp, [a.pickLat, a.pickLng]) - distKm(rp, [b.pickLat, b.pickLng]); });

    let shop = null, custKm, custCoords;
    if (pend.length) {
      const s = pend[0], sp = [s.pickLat, s.pickLng];
      const a = await route(rp, sp);
      const b = await route(sp, dp);
      shop = { name: s.shopName, pos: sp, km: a.km, coords: a.coords };
      custKm = a.km + b.km;
      custCoords = a.coords.concat(b.coords);
    } else {
      const c = await route(rp, dp);
      custKm = c.km;
      custCoords = c.coords;
    }

    trackPlan = {
      at: Date.now(),
      shop: shop ? { km: shop.km, sec: shop.km / SPEED_KMH * 3600 } : null,
      cust: { km: custKm, sec: custKm / SPEED_KMH * 3600 }
    };

    // ແຕ້ມໄອຄອນໄຣເດີ + ເສັ້ນທາງ
    trackLayer.clearLayers();
    riderMarker = L.marker(rp, {
      icon: L.divIcon({
        className: "",
        html: '<div class="rv"><div class="ring" style="transform:rotate(' + riderHeading + 'deg)"><i></i></div><span>🛵</span></div>',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
      }),
      zIndexOffset: 1000
    }).bindTooltip("ໄຣເດີ " + withRider.rider.riderName).addTo(trackLayer);
    if (shop) L.polyline(shop.coords, { color: "#2563eb", weight: 5 }).addTo(trackLayer);
    L.polyline(custCoords, { color: "#6b7280", weight: 4, dashArray: "8 6" }).addTo(trackLayer);

    if (!trackFitted) {
      const bounds = [rp, dp].concat(shop ? [shop.pos] : []);
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
      trackFitted = true;
    }

    // ກາດເວລາ/ໄລຍະ
    const card = $("trackCard");
    card.classList.remove("hidden");
    card.innerHTML =
      '<div class="row"><span><b>🛵 ' + esc(withRider.rider.riderName) + '</b></span><span class="muted">ກຳລັງ' + (shop ? 'ໄປຮັບສິນຄ້າ' : 'ໄປສົ່ງລູກຄ້າ') + '</span></div>' +
      (shop ? '<div class="row"><span>ໄປຮັບທີ່ <b>' + esc(shop.name) + '</b></span><span><span id="tShopK"></span> · <span class="cd" id="tShopT"></span></span></div>' : '') +
      '<div class="row"><span>ໄປສົ່ງລູກຄ້າ</span><span><span id="tCustK"></span> · <span class="cd" id="tCustT"></span></span></div>';
    tickTrack();
  }

  // ນັບຖອຍຫຼັງທຸກ 1 ວິນາທີ — ໄລຍະທີ່ເຫຼືອລົດລົງຕາມເວລາ
  function setLeft(k, leg, el) {
    const left = Math.max(0, leg.sec - el);
    const km = leg.sec > 0 ? leg.km * left / leg.sec : 0;
    const K = $("t" + k + "K"), T = $("t" + k + "T");
    if (K) K.textContent = km.toFixed(1) + " ກມ";
    if (T) T.textContent = fmtMmSs(left);
  }
  function tickTrack() {
    if (!trackPlan) return;
    const el = (Date.now() - trackPlan.at) / 1000;
    if (trackPlan.shop) setLeft("Shop", trackPlan.shop, el);
    setLeft("Cust", trackPlan.cust, el);
  }

  async function post(obj) {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(obj) });
    return r.json();
  }

  async function load() {
    if (!ID) { setMsg("ບໍ່ພົບເລກອໍເດີ"); return; }
    try {
      const r = await fetch(API + "?type=orderstatus&orderId=" + encodeURIComponent(ID), { cache: "no-store" });
      const rows = await r.json();
      const list = Array.isArray(rows) ? rows : [];
      if (!list.length) { setMsg("ບໍ່ພົບອໍເດີນີ້"); return; }
      const key = JSON.stringify(list);
      if (key === lastKey) { updateTrack(list).catch(function () {}); setMsg(""); return; }
      lastKey = key;
      $("oid").textContent = "ອໍເດີ " + ID;
      rememberOrder(ID);
      summary(list);
      const canCancel = list.every(function (o) { return CANCELABLE.indexOf(o.status) >= 0; });
      $("cancelBox").innerHTML = canCancel
        ? '<button class="btn danger" data-cancel="1">ຍົກເລີກອໍເດີນີ້</button>'
        : "";
      $("shops").innerHTML = list.map(shopCard).join("");
      drawMap(list);
      updateTrack(list).catch(function () {});
      setMsg("");
    } catch (e) {
      setMsg("ໂຫຼດຂໍ້ມູນບໍ່ໄດ້ ກຳລັງລອງໃໝ່...");
    }
  }

  // ຫຍໍ້ຮູບສລິບໃນເບຣາວເຊີ ແລ້ວສົ່ງເປັນ base64
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  document.addEventListener("change", async function (e) {
    const inp = e.target;
    if (!inp.dataset || !inp.dataset.slip) return;
    const f = inp.files && inp.files[0];
    inp.value = "";
    if (!f) return;
    setMsg("ກຳລັງອັບໂຫຼດສລິບ...");
    let res = null;
    try {
      const b64 = await shrink(f);
      res = await post({ type: "slip", row: Number(inp.dataset.slip), orderId: ID, mime: "image/jpeg", imageBase64: b64 });
    } catch (err) {}
    setMsg(res && res.ok ? "ອັບສລິບແລ້ວ ລໍຖ້າຮ້ານກວດຍອດ" : "ອັບໂຫຼດບໍ່ໄດ້ ລອງໃໝ່");
    load();
  });

  document.addEventListener("click", async function (e) {
    const co = e.target.closest("[data-callopen]");
    if (co) {
      const box = co.nextElementSibling;
      if (box) box.classList.toggle("hidden");
      return;
    }
    const x = e.target.closest("[data-cancel]");
    if (x) {
      if (x.disabled || !confirm("ຍົກເລີກອໍເດີນີ້ແທ້ບໍ?")) return;
      x.disabled = true;
      const res = await post({ type: "buycancel", orderId: ID }).catch(function () { return null; });
      setMsg(res && res.ok ? "ຍົກເລີກອໍເດີແລ້ວ" : "ຍົກເລີກບໍ່ໄດ້ ຮ້ານອາດກຳລັງດຳເນີນການແລ້ວ");
      x.disabled = false;
      load();
      return;
    }
    const c = e.target.closest("[data-claim]");
    if (c) {
      if (c.disabled) return;
      c.disabled = true;
      const res = await post({ type: "buyclaim", orderId: ID, row: Number(c.dataset.claim) }).catch(function () { return null; });
      setMsg(res && res.ok ? "ແຈ້ງຮ້ານແລ້ວ ລໍຖ້າຮ້ານກວດຍອດ" : "ແຈ້ງບໍ່ໄດ້ ລອງໃໝ່");
      load();
      return;
    }
    const b = e.target.closest("[data-paid]");
    if (!b || b.disabled) return;
    b.disabled = true;
    const res = await post({ type: "paymark", orderId: ID, row: Number(b.dataset.paid) }).catch(function () { return null; });
    setMsg(res && res.ok ? "ແຈ້ງໂອນຄ່າສົ່ງແລ້ວ ລໍຖ້າໄຣເດີຢືນຢັນ" : "ແຈ້ງບໍ່ໄດ້ ລອງໃໝ່");
    load();
  });

  load();
  setInterval(load, 15000);
  setInterval(tickTrack, 1000);
</script>
</body>
</html>
